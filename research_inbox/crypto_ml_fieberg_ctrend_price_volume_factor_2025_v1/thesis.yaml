economic_thesis:
  original_claim: CTREND aggregates price and volume indicators across several time horizons with machine-learning methods and is related to the cross-section of cryptocurrency returns.
  local_hypothesis: A learned multi-horizon trend composite may forecast relative future returns beyond any one transparent momentum or volume indicator in liquid crypto markets.
  evidence_class: AUTHOR_CLAIM_UNREPLICATED
mechanism:
  source_description: Information in price-volume history across multiple horizons is not fully summarized by existing crypto risk-factor models.
  economic_counterparty: UNKNOWN; trend continuation versus delayed attention is a LOCAL explanation, not causally proven in accessible abstract.
instruments:
  original_market: Authors evaluate more than 3000 cryptocurrencies, unspecified exchange/product intersection in accessible abstract.
  original_portfolio: CTREND factor, not a published exact dollar-neutral ATS portfolio in the available abstract.
  prop_firm_transfer: UNKNOWN; using only permitted liquid perps/CFDs is a separate hypothesis.
data_requirements:
  source: Price and trading volume across multiple horizons plus full indicator and model definitions from full paper.
  local: Hourly crypto panel MAY provide price/volume inputs, but source data identity, coverage and training vintage must be qualified.
feature_contracts:
  source: ML learns combination of technical price/volume characteristics over distinct lookback horizons.
  exact_features: UNKNOWN_FROM_ABSTRACT; do not invent moving-average lengths, model type, ranks, or weights.
  required_training_control: Fold-local feature selection, realistic purging, time-ordered OOF and model/feature manifest.
strategy_rules:
  original: CTREND is proposed as a factor and reported to predict cross-sectional crypto returns.
  unpublished: Exact model, feature pipeline, target horizon, rebalancing, portfolio sorting/legs/sizing are UNKNOWN from the read abstract.
  proposed_adaptation_only: Rank PIT liquid coins by a frozen CTREND-like prediction; form a separate ATS long/short basket if independently designed and authorized, not claim author replication.
signal_and_execution_clock:
  original: UNKNOWN; source abstract does not declare observation-to-fill chronology.
  scientific_need: Lagged completed bars, no future-data fit, exact target availability, next eligible executable fill.
sizing:
  original: UNKNOWN; factor is not itself a position-sizing rule.
cost_assumptions:
  source_reported: Authors claim CTREND survives tested transaction costs and remains predictive in large liquid coins.
  actual_local: No broker/perp spread, commission, financing or prop-firm eligibility qualified.
baseline:
  proposal: Simple price momentum and volume-adjusted momentum ranking on same PIT universe, horizon and fees.
development_evaluation:
  status: NOT_RUN
  authors_claims_not_verified_locally: Significant explanatory incremental factor value over known crypto factors across subperiods/states; not a local market result.
primary_falsifier:
  test: Learned multi-horizon combination does not outperform matched single-feature momentum and volume baselines net of costs within the liquid tradable universe.
acceptance_and_stop_rules:
  source_only: Capture abstracts faithfully; no executable declaration or empirical approval.
  stop: Source-specific exact CTREND recipe and clock must be obtained before a replication claim or ML training.
parity_and_causality_tests:
  required: Input availability, exact portfolio mapping, train-only transformations, OOF replay, liquid universe and delisting coverage.
