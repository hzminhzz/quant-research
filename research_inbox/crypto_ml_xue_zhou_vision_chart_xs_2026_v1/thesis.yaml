  incremental_ml_claim: "Authors report improvement over both CNN and conventional characteristic-sorted portfolios; significance and tradability were not independently checked."
  funding_boundary: "Source abstract describes OHLCV-like chart inputs, not funding, carry or basis features. Full source-feature whitelist remains to be verified."
