  bar_anchor: Top of the hour (HH:00:00 to HH:59:59)
  eligible_order_sequence: After completed hourly bar t, submit stop for immediately following eligible bar only.
  exit: 23:00 America/New_York on the same Monday.
  stop_gap_rule: Entry executes at max(Open_t+1, Trigger) with adverse slippage.
