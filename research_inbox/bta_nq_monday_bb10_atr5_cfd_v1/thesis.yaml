feature_contracts:
  source_parameters:
    band: lower Bollinger Band, 10 bars, one standard deviation
    volatility: ATR of 5 bars
    buffer: plus 0.8 times ATR5
  proposed_causal_math:
    lower_band: Mean of the ten most recently completed hourly closes minus one standard deviation of those closes.
    true_range: max(high-low, abs(high-previous_close), abs(low-previous_close)) using completed hourly bars.
    atr_smoothing: SMA_5 on completed true range bars.
    band_stdev: Sample standard deviation (ddof=1) of completed closes.
    trigger: lower_band_t + 0.8 * ATR5_t, with stop order placed only after bar t closes for possible fill in bar t+1.
  parity_status: NOT_NATIVE_VERIFIED; candidate math is a declared adaptation.
strategy_rules:
  ORIGINAL_AUTHOR_RULES:
    direction: long-only as implied by a buy stop
    entry_level: lower_Bollinger_10_1sigma plus 0.8 times ATR5
    order: stop entry, activated only when hit in the following hour
    filter: Monday only
    entry_window: 00:00 to 23:00, timezone NOT published
    exit: 23:00 on the same Monday, timezone NOT published
    instrument: NQ futures, 60-minute bars
  adapted_rules:
    instrument: Dukascopy NQ index CFD (usatechidxusd), 60-minute completed bars
    entry_window: Monday 00:00 to 23:00 America/New_York
    exit: Monday 23:00 America/New_York
    order: Next-bar buy-stop order placed at trigger level; fills if High_t+1 >= trigger.
signal_and_execution_clock:
