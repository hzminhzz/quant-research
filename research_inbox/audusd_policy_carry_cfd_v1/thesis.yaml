economic_thesis:
  question: Does monthly AUDUSD exposure aligned with the last publicly known RBA-minus-Fed
    policy-rate differential earn positive net total return on a broker margin-FX/CFD
    product?
  expected_effect: Positive after-cost monthly return in USD per fixed 10000 AUD face
    amount, including actual daily broker swap credits and debits.
  scope: A single-pair test of whether a published diversified currency-forward risk
    premium transfers to a retail margin-FX product.
  thesis_strength: HYPOTHESIS
  null_hypothesis: Expected after-cost monthly AUDUSD strategy return is less than
    or equal to zero.
  distinction: Macro policy-rate risk-premium exposure; not trend-following, a breakout,
    a Tokyo fix calendar event, or an equity opening premium.
mechanism:
  market_behavior: Higher-yielding currency exposures may deliver a premium because
    capital providers absorb global risk and liquidity-crash exposure.
  actors: Global FX hedgers, yield-seeking investors, funding-currency borrowers,
    and intermediaries hedging balance sheets.
  who_pays: Investors willing to transfer currency crash and funding-liquidity risk;
    broker financing charges may instead capture the premium.
  persistence: Risk-bearing constraints and hedging demand can persist, but a single
    liquid FX pair can be competitively priced.
  supporting_regimes:
  - Stable funding liquidity and persistent interest-rate differences.
  - Avoidance of abrupt funding-market deleveraging; this is a prediction, not a filter.
  destroying_regimes:
  - Currency crisis or global deleveraging with carry unwind.
  - Policy-rate convergence and reversal.
  - Retail swap charges that exceed theoretical interest income.
  key_failure_mode: Central-bank target spreads may poorly approximate forwards or
    executable broker rollovers.
  causal_claim_status: INFERENCE_FROM_ACADEMIC_EVIDENCE_NOT_PAIR_SPECIFIC_PROOF
