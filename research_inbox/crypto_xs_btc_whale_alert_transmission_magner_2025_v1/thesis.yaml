economic_thesis:
  source_fact: "The authors define a BTC whale-transfer signal using Whale Alert Telegram records of transfers between wallets and exchanges in both directions. They examine return contagion among 15 high-market-cap cryptocurrencies with a time-varying-parameter VAR over 1h, 6h and 24h post-transfer windows."
  author_reported_test_unverified: "The public abstract reports significant contagion chiefly at 6h and 24h. This is NOT verified excess return or a trading-system result."
  local_inference: "A publicly observed BTC inventory-transfer event might alter information or risk appetite across alts before all prices fully adjust, but the paper does not establish a causal executable forecast."
  economic_counterparty: "UNKNOWN; one conjecture is liquidity-demanding BTC holders and slower altcoin risk re-pricing."
  null: "Conditional lagged altcoin returns contain no reproducible incremental signal beyond synchronized BTC beta/common news and executable costs."
markets_and_data:
  source_instruments: "15 largest-cap cryptocurrencies examined by authors; exact historical ticker list, base/quote pairs, venue, spot-versus-derivative status and membership as of the original event dates UNKNOWN."
  signal_instrument: "BTC transfer records between wallet and exchange addresses, both directions, from Whale Alert Telegram; label provenance and alert publication timestamp not validated."
  original_clock: "Author response horizons 1h, 6h and 24h AFTER transfer; source does not expose real-time alert arrival, chain confirmation delays, or signal cutoff."
  local_target_clock: "ADAPTATION_PROPOSAL only: closed 1h bars and alert-availability timestamp, with possible 6h/24h economic response windows; 5m/15m not established by source."
  data_required: "Immutable timestamped original Whale Alert posts and chain-transfer metadata with availability clock; historical exchange-wallet address vintages; PIT 15-coin universe, exact bar quote/volume and eventual tradable contract terms."
  venue_for_prop_execution: UNKNOWN
