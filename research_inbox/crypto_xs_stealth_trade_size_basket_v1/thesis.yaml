    academic:
    - title: 'Stealth-Trading: Which Traders'' Trades Move Stock Prices?'
      authors: Barclay & Warner (1993), Journal of Financial Economics
      url: https://ideas.repec.org/a/eee/jfinec/v34y1993i3p281-305.html
    - title: Inferring Investor Behavior with Trade Size
