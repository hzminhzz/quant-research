economic_thesis:
  mechanism: News co-mentioned peer cryptocurrencies exhibit contemporaneous opposite-sign abnormal moves following a major idiosyncratic shock to another peer, then the induced mispricing reverses over subsequent weeks.
  source_claimed_strategy: Authors identify peers with NLP of historical financial-news co-mentions, identify abnormally shocked assets, and construct a trading strategy around subsequent reversal in shocked peers. Exact author portfolio entry/exit and leg directions require full-text rule extraction.
markets_and_data:
  instruments: Multiple cryptocurrencies and their news-linked peers; venue and tradable derivatives market UNKNOWN
  timeframe: Weekly shock/reversal framing, mispricing decay over roughly three weeks; exact decision and fill clock UNKNOWN
  data_requirements: Point-in-time published news co-mentions, news timestamp availability, returns to estimate idiosyncratic shocks, historic asset eligibility, eligible tradable crypto instruments
  prop_firm_rules: UNKNOWN
deterministic_strategy_specification:
  peer_definition: Assets co-mentioned by contemporary news; actual source NLP and formation window UNKNOWN
  signal: Abnormally large idiosyncratic return shock to focal cryptocurrency and opposite-signed contemporaneous peer response
  long_selection: UNKNOWN; do not infer source author long allocation from directional interpretation
  short_selection: UNKNOWN; do not infer source author short allocation from directional interpretation
