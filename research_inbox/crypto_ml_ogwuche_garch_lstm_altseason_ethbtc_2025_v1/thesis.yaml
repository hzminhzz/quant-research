economic_thesis:
  source_claim: Nonlinear time-varying relations between ETH and BTC might support a long/short relative-value pairs strategy when GARCH-type volatility dynamics and attention-LSTM conditional forecasts are filtered by the Altcoin Season Index.
  evidence_class: SOURCE_STATED_RESEARCH_PROPOSAL_NOT_A_VERIFIED_ALPHA_RESULT
mechanism:
  source: Static correlation and mean-reversion assumptions may fail as crypto regimes shift; conditional volatility forecasts and sequence dependence/regime state may adjust entries.
  uncertainty: Source abstract does NOT establish that the proposed strategy actually outperformed a causal matched baseline after brokerage costs.
instruments:
  original: ETH/BTC relationship (whether cross conversion, ETHUSD versus BTCUSD two legs, or spot versus perp is not specified in indexed abstract).
  local: Binance crypto OHLCV may cover ETH/BTC legs; direct ETHBTC pair and shortable prop products require exact mapping.
data_requirements:
  source: ETH/BTC price history sufficient for GARCH/EGARCH and LSTM; Altcoin Season Index historical values and publication-time availability.
  local: OHLCV may exist for legs; historical as-of Altcoin Season Index series and formation/revision methodology not verified.
feature_contracts:
  source: GARCH/EGARCH conditional volatility, attention mechanism with LSTM and Altcoin Season Index regime gate.
  labels: Exact spread forecast target, data frequency, training window, volatility model inputs, fitting intervals and label availability UNKNOWN.
strategy_rules:
  original:
    - Model volatility and relative ETH/BTC relations with GARCH-family and attention-based LSTM components.
    - Condition long/short pair-trading decisions on an Altcoin Season Index regime-switching filter.
    - Benchmark proposed results against conventional statistical pairs methods when complete rulebook is available.
  exact_entries: UNKNOWN; source abstract does not specify spread threshold, hedge ratio, stop/exit policy, sizing or target.
