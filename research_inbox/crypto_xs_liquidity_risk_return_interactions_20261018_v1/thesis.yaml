economic_thesis:
  mechanism: Non-additive cross-sectional interactions between past returns, liquidity, and asset risk may discriminate relative winners and losers beyond individual standalone factors.
  source_claimed_strategy: Authors examine double-sorted portfolios across 40 cryptocurrency characteristics, and describe an out-of-sample long-short portfolio selecting leading and lagging interactions. Source-exact interaction selection and portfolio logic require full-text extraction.
