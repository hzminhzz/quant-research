economic_thesis:
  source_claim: Learned variational latent factors from price/volume history may reveal cross-coin return relationships that yield cross-sectional trading opportunities.
  status: AUTHOR_ABSTRACT_UNVERIFIED
mechanism:
  proposed_explanation: Shared market factors and changing relative risk exposures may help explain differences in later coin returns.
  economic_counterparty: UNKNOWN; the abstract does not prove exploitable price inefficiency or incremental value over simple momentum.
instruments:
  original: Fifty major cryptocurrencies, exact historical membership and venue/spot-versus-perpetual contract type UNKNOWN.
  prop_firm_fit: Conditional on short availability, actual eligible pairs and leverage/account drawdown rules.
data_requirements:
  original: Price and volume-derived technical indicators for 50 major cryptoassets, 2019-2024 data and reported 2024 out-of-sample.
  local: Crypto price/volume panel may support a proxy; 2019 membership, listing and delisting coverage require PIT verification.
feature_contracts:
  source: Adapt FactorVAE latent factor structure from equity forecasting to cryptocurrency cross-sectional prediction.
  adaptation: Temporal regularization of latent factors is studied for improved stability and interpretability, per abstract.
  target: Cross-sectional predictive model outputs; precise training label, prediction horizon, factor dimension and loss are UNKNOWN.
strategy_rules:
  source_original:
    - Train a FactorVAE-type latent factor model on historical cryptocurrency technical indicators.
    - Derive cross-sectional predictions for a 50-asset universe.
    - Evaluate seven reported trading strategies, including directional, market-neutral, volatility-adjusted and momentum-filtered approaches.
  not_source: The abstract does not state exact buy/sell thresholds, equal-weight counts, leverage, rebalance schedule or stop prices.
signal_and_execution_clock:
  original: Decision interval and earliest executable fill not established by accessible abstract.
  future: Label maturation, embargo, rolling training and prediction-time artifacts must be independently specified from full source.
sizing:
  original: Multiple author strategy variants; exact weights and gross/net limits UNKNOWN. Do not merge them into a fictional universal rule.
cost_assumptions:
  source: Not available in inspected abstract; no validated fees/spreads/financing or slippage.
  prop: Real costs and allowed instruments UNKNOWN; no funding-derived alpha signal.
baseline:
  future_independent_proposal: PIT asset ranks using directly observable lagged momentum and/or PCA factor residuals, matched universe and risk.
development_evaluation:
  status: NOT_RUN
  source_claim: Six of seven author-tested variants positive Sharpe above one; momentum-filter variant reported 269.8% return and Sharpe 2.12, sample reported 2024; claims not independently verified.
primary_falsifier:
  future_test: Variational latent factors do not provide genuine chronological OOF incremental return ranking or after-cost basket improvement over simple observed factor/momentum benchmarks.
acceptance_and_stop_rules:
