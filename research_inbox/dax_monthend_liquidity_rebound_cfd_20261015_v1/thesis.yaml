economic_thesis:
  statement: A Germany 40 equity-index CFD position held over the last Xetra trading
    day of a month and the following three Xetra trading days may earn positive net
    EUR return and exceed an equal-duration, same-clock, prior-month-window control
    because institutions temporarily sell equities to obtain cash for clustered month-end
    payments, then buying demand returns.
  direction: long_only
  horizon: four_xetra_cash_sessions_three_intervening_session_gaps
  phenomenon: monthend_payment_and_settlement_related_liquidity_demand
  market_tradability_claim: HYPOTHESIS_NOT_ESTABLISHED
  economic_null: Mean paired (candidate net return minus control net return) <= 0;
    or candidate mean net return <= 0.
mechanism:
  verified: Etula et al. document a payment-cycle connection, settlement-sensitive
    monthly return reversals, and institutional trading evidence in historical equity
    markets, with Germany DAX among surveyed indices.
  inference: Liquidity-motivated investors who must raise cash before month-end and
    subsequent net buyers may pay a temporary price-pressure premium to investors
    willing to bear short-term systematic equity risk.
  hypothesis: This cross-sectional institutional mechanism remains visible in Germany
    40 index-price movements from 2018-2024 and is not fully absorbed by CFD spread,
    commission, overnight financing, slippage, or dividend adjustments.
  effective_payer: End-investors whose funds trade under settlement deadlines, fund
    inflow/outflow constraints, and institutional liquidity needs; NOT the broker
    merely by virtue of quoting the CFD.
  supporting_regimes:
  - regular_monthend_payment_and_settlement_cycles
  - sufficient_inventory_risk_and_hedging_demand
  - liquid_quote_access_to_equity_index_risk
  destructive_regimes:
  - persistent_equity_selloffs_or_macro_event_shocks
  - altered_payment_or_settlement_calendar
  - crowded_calendar_arbitrage
  - excessive_cfd_financing_or_dividend_adjustment
  - structural_disconnect_between_deu_idx_eur_cfd_and_xetra_equities
  distinguishing_driver: Predetermined institutional payment/settlement calendar,
    not price trend, ORB volatility compression, mean-reversion indicator, or policy-rate
    carry.
  primary_observable_falsifiers:
  - candidate_paired_net_advantage_nonpositive
  - candidate_standalone_net_return_nonpositive
  - direction_only_present_in_misidentified_price_index_or_unpriced_dividend_flows
  - improvement_disappears_at_verified_historical_costs
