  - T+3 at 17:10 local
  - T-10 at 09:10 local
  - T-7 at 17:10 local
  earliest_legal_fills:
  - next 1m bar at 09:11 or later
  - next 1m bar at 17:11 or later
  same_bar_fill: forbidden
  missed_exact_fill: fail_closed_month_pair
  dst: use_IANA_Europe_Berlin_not_fixed_UTC_offset
  holiday_source: official_historical_Xetra_calendar
  early_close_behavior: skip_if_required_1711_quote_unavailable
  month_boundary_behavior: T+1 to T+3 may be next calendar month; retain original
