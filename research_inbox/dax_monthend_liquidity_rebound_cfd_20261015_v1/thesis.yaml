feature_contracts:
- feature_name: xetra_session_distance_to_monthend
  classification: EXTENSION_REQUIRED
  purpose: Label a Xetra cash session by signed offset from its calendar month's last
    Xetra trading session T.
  mathematical_definition: 'Given a previously published ordered official Xetra session
    list S, let T(m)=max{d in S: calendar_month(d)=m}; for each session d in month
    m or adjacent offsets, distance(d)=ordinal_S(d)-ordinal_S(T(m)). For offsets +1
    to +3 use the same anchor month m recorded at entry; never infer a new anchor
    from the exit month''s own T.'
  raw_inputs:
  - official_xetra_session_calendar
  - local_session_date
  - anchor_month
  parameters:
    lookback_sessions: 10
    forward_exit_offset_sessions: 3
    timezone: Europe/Berlin
  grouping: instrument_symbol_and_anchor_month
  timeframe: 1m_timestamps_mapped_to_Xetra_sessions
  warmup: 10_prior_Xetra_sessions_for_control_entry
  earliest_availability: after_official_session_calendar_publication_prior_to_event_month
  causal_alignment: calendar_known_before_entry; verify_effective_date_not_revised_after_fact
  expected_provider: calendar extension outside price-indicator registry; inspect
    native ML4T scheduler first
  parity_tests:
  - known_monthend_friday_and_next_month_rollover
  - monthend_xetra_holiday_and_early_close
  - europe_berlin_march_october_dst
  - no_accidental_use_of_next_month_anchor_during_exit
  - append_future_prices_does_not_change_past_flags
- feature_name: xetra_local_signal_minute
  classification: EXTENSION_REQUIRED
  purpose: Select the exact local order-decision minute without using bar-close prices.
  mathematical_definition: minute_local = 60 * hour(timestamp converted UTC -> Europe/Berlin)
    + minute(timestamp); entry = 550 (09:10); exit = 1030 (17:10).
  raw_inputs:
  - timestamp_utc
  - timezone_database
  - official_xetra_session_calendar
  parameters:
    entry_hour: 09:10
    exit_hour: '17:10'
    timezone: Europe/Berlin
  grouping: instrument_symbol
  timeframe: 1m
  warmup: 0_bars
  earliest_availability: calendar_clock_instant_before_order_event
  causal_alignment: no_bar_prices_needed_for_signal; fill_on_later_eligible_bar_only
  expected_provider: native event scheduling if available, otherwise narrow calendar-time
    adapter
  parity_tests:
  - local_0910_maps_correctly_across_DST_transitions
  - no_signal_on_weekends_or_Xetra_holidays
  - verify_signal_and_fill_are_different_bar_indices
  - halfday_or_broker_closed_event_skipped_not_time_shifted
- feature_name: eligible_month_paired_windows
  classification: EXTENSION_REQUIRED
  purpose: Select the candidate and one negative-control window from a fixed calendar
    rule.
  mathematical_definition: 'Candidate: entry when distance=0, exit when same anchor''s
    distance=+3. Control: entry when distance=-10, exit when distance=-7. Each uses
    09:10 local entry decision and 17:10 local exit decision. Require that the start
    session weekdays match; otherwise record an ineligible paired month instead of
    shifting dates.'
  raw_inputs:
  - xetra_session_distance_to_monthend
  - xetra_local_signal_minute
  - historical_session_calendar
  parameters:
    candidate_start: 0
    candidate_end: 3
    control_start: -10
    control_end: -7
  grouping: instrument_symbol_and_anchor_month
  timeframe: 1m_with_monthly_session_anchor
  warmup: 10_prior_Xetra_sessions_for_control
  earliest_availability: once_event_month_official_calendar_available
  causal_alignment: control_and_candidate_months_chosen_before_any_return_observation
  expected_provider: calendar-only ML4T strategy event schedule; native support UNVERIFIED
  parity_tests:
  - at_most_one_candidate_and_one_control_per_anchor_month
  - no_overlap_of_candidate_and_control_positions
  - same_weekday_start_requirement
  - no_event_has_entry_or_exit_at_or_after_2025_01_01
  - future_quote_availability_never_used_to_filter_entry; later_gaps_reported_as_data_invalid
strategy_rules:
  source_rules:
    author_trade_strategy: NOT_PROVIDED
    source_study: Etula et al. analyze market returns and institutional liquidity
      around month-end; this YAML is a NEW CFD calendar adaptation, not a faithful
      author trading algorithm or replication of all paper event windows.
  adaptation:
    name: dax_tom_cash_rebound_first_four_cash_sessions
    calendar_anchor: T = last regular Xetra trading session of month m
    candidate:
      side: BUY
      signal: At 09:10 Europe/Berlin on T using the prepublished Xetra calendar and
        current broker-session eligibility only; never condition entry on future quote
        coverage.
      entry_order: market_buy
      entry_fill: first valid executable bar at or after 09:11 on T, never before
        09:11
      hold: without_price_based_stop_or_filter
      exit_signal: At 17:10 Europe/Berlin on Xetra session T+3 of the entry anchor
        month.
      exit_order: market_sell_to_flat
      exit_fill: first valid executable bar at or after 17:11 on T+3, never before
        17:11
    control:
      side: BUY
      signal: At 09:10 on Xetra session T-10 of same anchor month.
      entry_fill: first valid executable bar at or after 09:11 on T-10
      exit_signal: At 17:10 on Xetra session T-7.
      exit_fill: first valid executable bar at or after 17:11 on T-7
      comparability_gate: start weekday candidate must equal start weekday control;
        otherwise skip both
    order_behavior: Trigger only at scheduled local event clocks. Use event-driven
      next-eligible bar fill with spread/fees. If an exact 09:11 or 17:11 quote is
      missing, fail that monthly pair; do not search forward for a favorable fill.
    max_concurrent_positions: 1
    state_machine:
    - FLAT_TO_CONTROL_LONG
    - CONTROL_LONG_TO_FLAT
    - FLAT_TO_CANDIDATE_LONG
    - CANDIDATE_LONG_TO_FLAT
    reset: both windows separate; no carry into next anchor month after scheduled
      exit
    missing_data: At entry, use only available quotes. If a required later quote is
      missing, flag the pair as post-event DATA_INVALID, report it and stop qualification
      when material; never filter entries using future quote completeness or interpolate.
    session_boundary: No trades outside observed CFD tradable hours; skip if broker
      open and Xetra reference time disagree.
    premature_closure: Quote outage or forced broker close -> label BLOCKED_DATA/ineligible;
      no synthetic liquidation.
    alternative_filters: none
    optimization: prohibited_in_this_MVP
signal_and_execution_clock:
  timezone: Europe/Berlin
  primary_session: Xetra
  source_timestamp: UTC, expected bar_start, unverified
  signal_condition_known: Only official published calendar and strategy state; no
