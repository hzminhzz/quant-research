primary_falsifier:
  statement: The economic thesis fails in the frozen development MVP if the standalone
    candidate mean executed net return is <= 0 or its mean paired net return advantage
    over the fixed equal-duration control is <= 0, with at least 60 complete pairs,
    fully verified costs, native execution, and intact clocks.
  secondary: If pair advantage is positive but HAC 95% lower bound <= 0, classify
    INCONCLUSIVE, not profitable.
acceptance_and_stop_rules:
- when: Any source, broker-cost, quote-timing, calendar, multiplier or protected-data
    requirement cannot be verified.
  action: BLOCKED_DATA
- when: Fewer than 60 valid pairs or fewer than 6 distinct eligible years; or too
    many excluded holiday months.
  action: INCONCLUSIVE
- when: Post-entry exit quote is missing, preventing trustworthy fill/accounting;
    do not silently exclude selected entries.
  action: BLOCKED_DATA
- when: Causal clock, source identity, dividend accounting or cash/position parity
    fails.
  action: INVALID_RESEARCH_DO_NOT_SCORE
- when: At qualified sample size candidate mean net <= 0 or paired net advantage <=
    0.
  action: REJECT
- when: Candidate and paired excess point estimates > 0 but HAC 95% lower bound <=
    0.
  action: INCONCLUSIVE
- when: Candidate mean net > 0 and paired HAC lower bound > 0 with complete verified
    accounting.
  action: CONSIDER_VALIDATION_NOT_PROMOTION
- when: Any non-predeclared window, entry clock, market, parameter or control change
    is suggested by observed outcomes.
  action: NEW_TRIAL_REQUIRED_AND_STOP_THIS_MVP
- when: Candidate decision reached or qualification blocker logged.
  action: STOP_AFTER_ONE_TRIAL
parity_and_causality_tests:
- Xetra official calendar parity including 2020 holidays, New Year closings, DST switch
  dates, and early closes.
- Distinct decision bar and strictly later fill bar at both open/close clocks.
- Position always flat between control exit and candidate entry.
- Anchor month not recomputed when exit occurs in following calendar month.
- No use of timestamps at or after 2025-01-01; December 2024 skipped if needed.
- Advancing future data leaves all earlier calendar features and decisions unchanged.
- Duplicate/missing/stale entry or exit quote rejects the entire pair.
- Bid/ask mark-to-fill, fees, financing, dividend events independently reconcile to
  NAV.
- Source symbol DEU.IDX/EUR genuinely maps to catalog index_minute_DAX, with same
  price/index variant.
- Compare gross-only results with fully costed results to detect cost absorption,
  without optimizing settings.
- Native ML4T strategy, event scheduler, order semantics and lifecycle verified against
  installed API by executor.
- No result treated as unseen validation because discovery was literature-informed.
known_adaptations:
- Historical study measures DAX cash-index total returns; proposed execution is broker
  OTC Germany 40 CFD.
- Paper investigates a broad set of calendar windows; MVP freezes T..T+3 and T-10..T-7,
  not an exact author strategy.
- Fixed 09:10/17:10 local timing avoids auction and late-close assumptions; source
  did not prescribe these clocks.
- Market orders and real broker debit/credit treatment differ from index total returns.
- DAX index includes a performance and price variant, while CFD replication treatment
  is unknown.
- Index constituent mix changed from 30 to 40 names during the intended retrospective
  sample.
- EU equity T+2 is an underlying-cash-market mechanism; CFD itself has no equity settlement
  cycle.
verified_facts:
- Etula et al. (2020) examine Germany DAX and settlement-linked international month-end
  equity return patterns through 2013.
- EU equities currently use T+2; transition to T+1 scheduled for 2027-10-11.
- Dukascopy lists DEU.IDX/EUR as Germany 40 CFD.
- Xetra publishes a cash session commonly running 09:00-17:30 Europe/Berlin.
- Repository docs/DATA_CATALOG.md lists index_minute_DAX with 1m 2018-2026 coverage
  but does not prove every required bar.
- Repository market policy permits explicit CFD price-proxy adaptations with source
  and cost gates.
assumptions:
- The premium from the older DAX cash-index sample may persist in 2018-2024; this
  is UNTESTED.
- T..T+3 captures post-payment institutional reinvestment; author findings motivate
  but do not verify this adaptation.
- Small 1x-notional order has negligible price impact only after broker qualification.
- 2018-2024 development is allowable; 2025 onward conservatively excluded pending
  repository-level holdout verification.
- 09:11 and 17:11 executable broker quote bars exist often enough; completeness unverified.
unresolved_blockers:
- id: source_identity
  severity: blocking
  question: Does index_minute_DAX trace actual Dukascopy DEU.IDX/EUR for each historical
    date? Which DAX performance/price variant?
- id: costs
  severity: blocking
  question: Are dated executable bid/ask spreads, commissions, index dividends and
    overnight financing available for the proposed broker and account?
- id: bar_clock
  severity: blocking
