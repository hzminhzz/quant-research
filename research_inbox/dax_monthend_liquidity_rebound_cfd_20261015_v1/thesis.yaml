    implementation_rule: Coding agent must inspect installed ml4t.engineer and ml4t.backtest
      feature/scheduler interfaces. Reuse native capabilities when possible. If time
      flags require an extension, keep it minimal and registered; no bespoke backtest
      or new execution infrastructure.
