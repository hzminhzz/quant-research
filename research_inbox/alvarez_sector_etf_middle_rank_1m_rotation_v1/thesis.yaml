economic_thesis:
  local_hypothesis: "At a monthly horizon, sector ETFs ranked in the middle of short-term performance may avoid a temporary reversal of the strongest leaders while retaining positive sector momentum and equity beta. This is a local hypothesis, not an established mechanism."
  null_hypothesis: "No incremental net tradable advantage over preregistered same-market baseline."
mechanism:
  plausible_economic_process: "Top-sector 1-month returns can be susceptible to short-run reversals after concentrated inflows; middle-ranked ETFs may show less reversal. Counterparty unknown; this may be data-mined rank selection."
  counterparty: "UNKNOWN"
instruments:
  original_product: "Nine US Select Sector SPDR ETFs XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY. No index-futures or CFD substitution."
  product_substitution: "NONE"
