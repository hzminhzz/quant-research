  "feature_contracts": [
    {
      "name": "sma200_close",
      "formula": "arithmetic_mean(C[t-199],...,C[t]) using exactly 200 completed consecutive eligible ETF sessions including signal session t",
      "lookback_sessions": 200,
      "smoothing": "simple arithmetic average; not EMA",
      "group_by": "ETF_symbol",
      "availability": "after official regular-session close for session t",
      "causality": "strictly trailing inclusive; at least 200 qualified sessions"
    },
    {
      "name": "low7_close",
      "formula": "min(C[t-6],...,C[t]); entry flag C[t] <= low7_close[t]",
      "lookback_sessions": 7,
      "smoothing": "none",
      "tie_policy": "inclusive <= as author's Method 1",
      "group_by": "ETF_symbol",
      "availability": "after session t close"
    },
    {
      "name": "high7_close",
      "formula": "max(C[t-6],...,C[t]); exit flag C[t] >= high7_close[t]",
      "lookback_sessions": 7,
      "smoothing": "none",
      "tie_policy": "inclusive >=; local interpretation symmetrical to published low rule, verify source AmiBroker code before implementation",
      "group_by": "ETF_symbol",
      "availability": "after session t close"
    },
    {
      "name": "eligible_trend",
      "formula": "C[t] > sma200_close[t]",
      "availability": "after t close",
      "notes": "Strict greater-than, not >=."
    }
  ],
