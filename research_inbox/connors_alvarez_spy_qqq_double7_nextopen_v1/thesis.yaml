  "economic_thesis": {
    "statement": "A US equity index ETF above its own 200-session closing SMA, but closing at the minimum of its most recent seven session closes, may experience a short-lived liquidity-driven reversal after the next cash-market open. This is a negative-replication-first hypothesis because the author documented post-2008 deterioration.",
    "economic_null": "On pre-authorized point-in-time development data, the 3-session signed next-open-to-next-open return after Double-7 entry events does not exceed a date/regime-matched eligible non-event baseline after prospective costs.",
    "scope": "SPY and QQQ US cash ETFs tested separately; no cross-sectional rank and no basket selection.",
    "source_claim_status": "The author's 2000-2007 favorable results and 2008-2015 deterioration are source claims, not independently reproduced alpha."
  },
  "mechanism": {
    "hypothesis": "Dip buyers and short-term inventory providers may be compensated when temporary risk-off selling creates multi-day lower-close pressure in an established uptrend.",
    "counterparty": "Urgent liquidity-demanding sellers and short-term de-risking flows; inferred, not identified from trade data.",
    "risk_premium_alternative": "Exposure timing and crash-risk insurance rather than alpha; a 2008 tail event may dominate.",
    "competing_explanations": [
      "Broad index beta and time out of market explain drawdown changes.",
      "Seven-session threshold selected after research and may be mined.",
      "Increased arbitrage and ETF efficiency may have eliminated historical reversal premium.",
      "Opening gaps can remove the alleged end-of-day edge.",
      "One unbounded holding episode can dominate drawdown without a stop."
    ]
  },
