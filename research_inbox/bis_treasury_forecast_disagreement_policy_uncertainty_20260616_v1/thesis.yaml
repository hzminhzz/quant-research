economic_thesis:
  SOURCE_FACT: "BIS WP 1361 examines intraday US Treasury futures or yield responses to surprise components of six major US economic announcements, including inflation, employment and GDP, using observations from 1998-2024."
  AUTHOR_REPORTED_UNVERIFIED: "Greater pre-release disagreement among forecasters dampens yield-curve response magnitude to the same macro surprise; higher monetary-policy rate uncertainty amplifies response magnitude. This is conditional response sensitivity, not reported positive trading PnL."
  LOCAL_INFERENCE: "The same signed macro surprise may have materially different price impact depending on the information environment known before the release; opportunity may involve impact magnitude or risk sizing rather than directional alpha."
  null: "Pre-release disagreement and policy uncertainty do not improve causal prediction of absolute or signed Treasury-futures event response after regime and release controls."
mechanism:
  SOURCE_FACT: "Authors describe Bayesian learning: widely dispersed forecasts can make releases less informative about future policy, whereas high monetary policy uncertainty raises news diagnosticity."
  adverse_regime: "Inflation response sensitivity changed after the pandemic, while jobs releases weakened; constant coefficients across regimes are not source-faithful."
