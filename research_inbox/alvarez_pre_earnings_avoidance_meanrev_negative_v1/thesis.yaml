strategy_rules:
  original_author_rules:
    - 'Baseline: member of Quantopian Q500US; RSI(2) crosses under source-tested 1, 3, or 8; close above 200-day average; rank by highest 100-day historical volatility.'
    - 'Enter at next trading-day 09:32 minute bar.'
    - 'Exit if RSI(2) > 80 or position is held for more than 15 days, using next-day 09:32 bar.'
    - 'Avoid-entry treatment: next scheduled earnings must be more than 7 days away.'
    - 'Early-exit treatment: if earnings in two days, exit next trading day (one day before earnings).'
