economic_thesis:
  hypothesis: 'Restricting equity mean-reversion exposure ahead of known earnings might reduce event-gap losses, but the original author reported worse outcomes.'
  null_hypothesis: 'No after-cost, exposure-controlled improvement versus the same baseline without earnings exclusions.'
  classification: SOURCE_REPORTED_NEGATIVE_RESULT_WITH_UNPROVEN_CAUSALITY
mechanism:
  source_fact: 'Earnings events create scheduled information/gap risk, but the article reports the tested avoidance treatment underperformed.'
  local_inference: 'Avoiding earnings could remove volatile recoveries as well as losses, or simply substitute other stocks in a capacity-constrained strategy.'
