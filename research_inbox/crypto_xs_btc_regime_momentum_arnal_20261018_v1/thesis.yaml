  basket_construction: "Within basket softmax score, 30d inverse-vol, exponential smoothing alpha=0.25, portfolio vol target 20 percent annualized with max 3x leverage."
  regime_and_risk: "BTC > 200d MA bull gross 1.0, momentum tilt; BTC < 200d MA bear gross 0.5, low-vol tilt, top K count 30 percent lower."
