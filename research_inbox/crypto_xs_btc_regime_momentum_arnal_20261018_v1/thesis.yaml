economic_thesis:
  mechanism: Cross-sectional winners-versus-losers returns conditional on BTC trend and 30-day realized coin volatility can diversify directional beta while controlling crypto crash exposure.
  source_claimed_strategy: "Rank 35 liquid cryptocurrencies by 10/20/60-day momentum, cross-sectional z-score winsorized at 3 SD, ensemble top-three in-sample configurations. Long top ranks, short bottom ranks; soften scores with softmax and inverse-vol weighting. Reduce gross exposure and holding count in BTC below-200d-MA state; smooth weights and volatility-target the portfolio."
