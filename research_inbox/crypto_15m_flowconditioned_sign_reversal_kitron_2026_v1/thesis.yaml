    url: https://arxiv.org/html/2608.21888
    title: "Short-horizon mean reversion in cryptocurrency markets: a matched cross-market measurement"
    authors: Nadav A. Kitron; Jonathan M. Wengrowicz
    source_date: "2026-08-22"
    evidence_class: SOURCE_FACT
  - source_id: kitron_wengrowicz_replication_repository
