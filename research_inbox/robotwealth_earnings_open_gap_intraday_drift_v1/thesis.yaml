  original_author_rules:
    - "HYPOTHESIS, not production rule: condition on nonzero sign of post-earnings opening gap, then measure same-session Open-to-Close return signed with the gap."
    - "Investigate sensitivity to normalised jump magnitude and time period; author did not freeze an entry cutoff or executable position rule."
    - "The source explicitly notes no costs and hypothetically buying the first opening print, which is not an eligible ex-post fill."
  unpublished_necessary_parameters: "Entry after observation of open, exit, event lag / timestamp, sizing, allowable liquidity and stop rules all UNKNOWN; don't invent."
