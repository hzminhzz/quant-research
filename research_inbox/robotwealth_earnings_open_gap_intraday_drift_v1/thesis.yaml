feature_contracts:
  source_conditions:
    - "Original source restricts observations to earnings announced while US cash market closed, 1999 through May 2016."
    - "Overnight jump = next regular market open / prior regular market close - 1; standardized jump = overnight jump / standard deviation of preceding 90 overnight returns."
    - "Source tests positive vs negative jump signs, then bins standardized jump magnitudes using source's arbitrary bins, then compares historical subperiods."
  availability_note: "Signal derives from the first official open: cannot preposition at that same print after observing it. Point-in-time time-stamped post-open order quote is required."
