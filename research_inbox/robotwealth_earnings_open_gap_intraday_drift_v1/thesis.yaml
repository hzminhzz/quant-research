economic_thesis:
  local_hypothesis: "Following out-of-market-hours earnings news, the next cash-session open gap may only partially impound the information, leading to same-day directional drift except at extreme gaps where illiquidity and overreaction may dominate."
  null_hypothesis: "Signed after-open continuation among historically eligible post-earnings events does not exceed matched control conditional opening gaps after realistic tradability and selection tests."
