feature_contracts:
  - id: roc63
    feature_type: cross_sectional_trailing_price_momentum
    formula: 100 * (adjusted_close_t / adjusted_close_t_minus_63_completed_sessions - 1)
    source_equivalent: AmiBroker_ROC_C_63
    window: 63_completed_daily_stock_sessions
    availability: after_finalized_last_trading_day_month_close
    strict_grouping: security_id_as_of_date
    caution: Split_and_dividend_convention_must_be_reconciled_against_source
  - id: hv63
    feature_type: trailing_realized_daily_log_return_volatility
    formula: 100 * sqrt(252) * sample_stddev(last_63_completed_log(C_t / C_t_minus_1))
    source_equivalent: AmiBroker_StDev_log_C_over_Ref_C_minus_1_63_times_sqrt_252_times_100
    window: 63_completed_daily_return_observations_requires_64_closes
    availability: after_finalized_last_trading_day_month_close
    caution: ddof_sample_vs_population_and_adjustment_convention_require_source_parity
  - id: roc63_times_hv63
    feature_type: cross_sectional_stock_rank
    formula: roc63 * hv63
    direction: descending_highest_first
    availability: after_both_roc63_and_hv63_are_finalized
    source_equivalent: AmiBroker_ROC_C_63_times_HV_63
  - id: individual_sma200
    feature_type: eligibility_filter
    formula: arithmetic_mean_of_stock_last_200_completed_session_closes
    condition: stock_month_end_close_greater_than_sma200
    availability: after_month_end_close_finalized
  - id: spx_sma200
    feature_type: market_state_filter
    formula: arithmetic_mean_of_SPX_last_200_completed_session_closes
    condition: SPX_month_end_close_greater_than_sma200
    availability: after_month_end_close_finalized
