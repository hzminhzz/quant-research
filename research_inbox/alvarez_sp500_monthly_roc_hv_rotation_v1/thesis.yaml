economic_thesis:
  scope: point_in_time_sp500_us_cash_equities_monthly_cross_sectional
  question: Does multiplying positive trailing stock momentum by its trailing realized volatility improve cross-sectional next-month ranking of S&P 500 constituents relative to raw momentum alone, without the apparent gain being explained by high-beta, small-cap-within-index, or sector concentration?
  null: The incremental month-ahead cross-sectional predictive information of ROC63 times HV63 over ROC63 alone is not positive on chronological development observations.
  source_author_claim: The author's 2007-2020 comparison found ROC times historical volatility better than raw ROC in aggregate report metrics; this is neither a validated independent reproduction nor evidence of current net profitability.
  expected_horizon: one_exchange_calendar_month
mechanism:
  economic_story_hypothesis: High realized volatility multiplying strong recent positive momentum might identify stock-specific repricing episodes with continuing delayed institutional reaction, beyond plain momentum.
  risk_premium_alternative: An apparent advantage may simply load on high-volatility high-beta growth stocks, momentum crashes, sector concentration, or bull-market beta rather than exploitable cross-sectional alpha.
  potential_counterparty: Slower discretionary rebalancers reacting to new stock information; unproven conjecture, not a measured flow.
  why_might_persist: Heterogeneous reaction speeds to firm news and constraints on rapid portfolio rotation; not established by the practitioner test.
  failure_modes:
    - Risk-on beta and winner-concentration fully explain apparent advantage.
    - Top-ranked names suffer volatility drag, overnight gap slippage and momentum crashes.
    - Static current-constituent lists create false survivorship alpha.
    - Entering after the open rather than at the historical open removes any advantage.
