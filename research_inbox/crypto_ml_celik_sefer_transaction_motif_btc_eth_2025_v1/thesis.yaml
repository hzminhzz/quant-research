economic_thesis:
  source_fact: 'Subgraph motif distributions and connectivity in native BTC/ETH transaction graphs encode economically relevant participant network activity that price-only autoregressive models omit.'
  plausible_mechanism: 'Changes in how distinct wallets transfer value might signal changing participation and information dispersion before price adjustment.'
  null_hypothesis: 'Price-only time-series predictors and simple historical on-chain counts/flow statistics provide equivalent prospective directional predictive value.'
  no_source_alpha_claim: 'Authors report price and price-direction forecast metrics, not an after-cost trading strategy.'
  nonbasket: 'Separate BTC and ETH forecasting exercises; neither is cross-sectional ranking or relative-value basket.'
mechanism:
  proposed_incremental_ml: 'Contextual wallet transaction motifs may interact nonlinearly over time; GNN motif embeddings plus self-attention LSTM can represent structural patterns beyond univariate transaction count.'
  alternative_explanation: 'Additional parameters, hindsight graph construction, address clustering artifacts or shared market trend rather than genuine predictive network information.'
  data_dependency: 'Point-in-time weekly blockchain transaction graphs; daily source price data alone cannot replicate it.'
instruments:
  source_original: 'Bitcoin BTC and Ethereum ETH blockchain networks; Yahoo Finance daily BTC and ETH price series, not an identified executable Binance or derivative product.'
  intended_trading_instrument: 'UNKNOWN; publication describes forecasting, not an exchange trading simulation.'
  substitution_policy: 'No auto-substitution with Binance USDT perpetual futures or a dollar-neutral basket.'
data_requirements:
  source_graphs: 'BTC and Ethereum public blockchain APIs, 2016 to end-2024; account/address vertices and value transfer edges aggregated into weekly timestamped transaction graphs.'
  source_prices: 'Daily BTC and ETH Yahoo Finance prices, 2016-2024.'
  source_data_availability: 'Paper says full datasets available from authors on reasonable request; local point-in-time transaction graphs and original code unavailable or unverified.'
  causality_hazards: 'Weekly graph closes may postdate the daily forecast target; all blocks, confirmation latencies, updated wallet labels, motif dictionaries and graph normalization must be fitted only as-of the prediction timestamp.'
feature_contracts:
  author_method: 'Unsupervised sampled motif dictionary and motif convolution from attributed relational transaction graphs, GNN embeddings, self-attention LSTM combined with historical daily prices.'
  original_ablation: 'Source compares price-only SVM, LSTM, HLSTM, GRU; also compares GNN embedding methods.'
  future_simple_controls: 'Price-only autoregressive rule; lagged weekly transaction count and volume; linear/Ridge on simple causal graph summary and daily price lags.'
