economic_thesis:
  hypothesis: Total realized quadratic variation decomposes into continuous diffusive
    Brownian motion and discontinuous jump components via Realized Bipower Variation;
    altcoins whose quadratic variation is dominated by discontinuous price jumps over
    the trailing 7 days (high Jump Ratio JR_i = max(RV - BV, 0) / RV) impose unhedgeable
    gap risk and liquidation uncertainty on institutional market participants. To
    clear the market, these jump-heavy assets trade at deep structural valuation discounts,
    yielding an equilibrium jump tail risk premium. Longing high-jump-ratio altcoins
    and shorting smooth diffusive altcoins in a 72h dollar-neutral basket captures
    this jump risk premium while eliminating directional market beta.
  null_hypothesis: The signal from Cross-Sectional Realized Bipower Jump Variation
    & Discontinuous Tail Risk Premium Basket exhibits zero risk-adjusted return spread
    beyond benchmark market exposure and transaction costs.
  expected_direction: Long high-ranked assets / Short low-ranked assets (or directional
    positioning based on threshold rules)
  expected_holding_period: 72-Hour Rebalanced Basket
  opposite_exposure_counterparty: Risk-averse institutional desks overpaying for smooth
    diffusive tokens while selling discontinuous jump-prone tokens at steep valuation
    haircuts.
  persistence_rationale: 'Structural market friction: discrete price jumps cannot
    be replicated or hedged with continuous rebalancing, forcing an enduring equilibrium
    return premium for bearing jump risk.'
  decay_conditions: The edge could diminish if institutional arbitrageurs eliminate
    liquidity air-pockets, or if borrowing costs drop to zero.
  alternative_explanations: Short-term post-shock liquidity dry-up, bid-ask bounce,
    or continuous market beta correlation.
  falsification_conditions: The hypothesis is falsified if the signal rank IC against
    forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or
    if net returns after 18.0 bps round-trip friction are non-positive.
  evidence_separation:
    verified_evidence:
    - Empirical financial literature confirms the core behavioral or structural phenomenon
      across derivative and high-frequency asset classes.
    - Workstation Parquet catalog contains multi-pair perpetual OHLCV and funding
      settlements enabling causal backtesting.
    assumptions_and_inferences:
    - 18.0 bps round-trip transaction friction is conservative for top liquid perpetual
      contracts.
    - Execution at NEXT_BAR open with frozen stops eliminates lookahead bias.
