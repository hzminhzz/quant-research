  "economic_thesis": {
    "question": "Do unusually large US500 cash-session opening gaps down in an ex-ante below-SMA200 environment overshoot and recover sufficiently by the same cash-session close to cover conservative executable CFD costs?",
    "null": "The causally executable after-opening signed conditional return is not economically positive net of a prospectively justified cost hurdle and offers no incremental benefit over unconditional large-gap-down opportunities with the same clocks.",
    "source_origin": "Rob Hanna's published 2008 SPY RTH opening-gap study.",
    "scope": "single_asset_intraday_event_not_cross_sectional",
    "portfolio_redundancy": "UNKNOWN; compare with local US500 rebound/volatility studies before freezing."
  },
  "mechanism": {
    "economic_story": "Forced sales and precautionary bids/asks around a bearish cash-session open may temporarily dislocate the opening price; short covering and liquidity normalization may produce positive intraday mean reversion.",
