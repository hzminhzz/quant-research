    "who_pays": "Forced/liquidity-demanding sellers accepting unfavorable opening execution.",
    "alternative_explanations": [
      "Crisis-day market beta and highly variable volatility, not alpha.",
      "Measurement of opening auction and vendor quote differences.",
      "Historical multiple-testing selection of gap threshold and trend regime.",
      "Source backtest profitability concentrated in 1993-2008 severe crises."
