  stop_on: ["Only post-hoc registry flow is available", "Compliance dates/vintages not as-of", "Allowance price product cannot be linked to executable instrument"]
parity_and_causality_tests:
  needed: ["Registry data event-vs-publication timestamps", "Current versus past EU ETS compliance dates", "Spot EUA versus futures contract identity", "Maturity roll and financing", "Commodity risk and seasonal placebo"]
verified_facts:
  - "NBER Working Paper 35356 has four listed authors, June 2026 issue and arXiv preprint."
  - "Abstract states 2.7 million EU ETS transfers over 2005–2021, April purchase clustering, elevated contemporaneous returns and predictive operator flows."
unresolved_blockers:
