    and slippage schedule applied historically at these times?
- id: broker_calendar
  severity: BLOCKED_DATA
  question: What is the as-of broker entity holiday/exception schedule for USA500.IDX/USD?
- id: candle_semantics
  severity: BLOCKED_DATA
  question: Are minute timestamps bar-start or bar-end, quote or trade, and how did
