economic_thesis:
  claim: The expected USD return of a long US large-cap index position during the
    four hours around European investor arrival is larger than that of an equally
    long preceding four-hour Asian/evening window. The premium must remain positive
    after broker-specific CFD trading costs.
  horizon: 4 hours per eligible Sunday-Thursday US Eastern night
  not_claimed: No claim of positive CFD Sharpe, replicated returns, or known causality.
  distinction_from_existing_strategies: Deterministic time-of-day exposure, not an
    indicator-conditioned trend, breakout, ORB, RSI, or mean-reversion signal.
  original_source_design:
    target_market: CME E-mini S&P 500 futures, ES; no CFD observations in source paper
    measurement_window: 23:30-03:30 America/New_York, sourced from authors appendix
      Table IA.4
    evidence_sample: Main source historical sample 2004-July 2018 (not an unobserved
      holdout)
    unprovided_execution_details: Do not attribute this YAML next-minute market order,
      Dukascopy commission, CFD lot size, or CFD spread assumptions to the authors.
mechanism:
  verified_source_interpretation: The authors associate European-open E-mini returns
    with European market participants processing overnight information and a fall
    in uncertainty.
  inference: Global time-zone segmentation and institutional participation may make
    the timing of compensation for bearing equity risk uneven within the day.
  hypothetical_payer: Investors demanding liquidity to transfer equity risk as Europe
    opens, or investors who sold equity exposure earlier at a discount to avoid unresolved
    uncertainty. Neither payer has been observed in this CFD feed.
  persistence_argument: Investor schedules and institutional market-open constraints
    change slowly; publication and arbitrage can erase the effect.
  supportive_regimes:
  - Uncertainty accumulated during Asian overnight hours
  - Liquid, open European and US index futures/CFD sessions
  destructive_regimes:
  - Overnight negative global equity shock
  - Premium competed away
  - Wider CFD bid-ask or dealer repricing
  - Broker maintenance/holiday closures
  alternative_explanations:
  - Generic equity risk premium
  - Different overnight spreads/liquidity
  - US news releases
  - Historical sample selection
  - Index proxy/broker price discrepancies
