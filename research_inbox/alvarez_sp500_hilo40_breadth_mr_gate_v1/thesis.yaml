economic_thesis:
  local_hypothesis: "When cross-sectional new-high participation collapses, an oversold-stock reversion strategy may have unfavorable crash-tail and clustering risk. A smoothed high-low breadth gate may reduce exposure in those states without merely replicating index SMA200 timing."
  null_hypothesis: "No incremental net tradable advantage over preregistered same-market baseline."
mechanism:
  plausible_economic_process: "Breadth weakening can proxy common liquidation stress and correlated stock sell-offs. Counterparty and causal mechanism NOT verified."
  counterparty: "UNKNOWN"
instruments:
  original_product: "Point-in-time S&P 500 common stocks; S&P 500 constituent breadth series; SPX as an alternative market-timing comparator. No CFD substitution."
  product_substitution: "NONE"
data_requirements:
  needed: "Point-in-time S&P 500 constituents including exited members, contemporaneous 3-month highs/lows (lookback convention unknown), daily adjusted and unadjusted OHLCV, dollar volume, historical volatility, RSI, equity opening bid/ask and limit fill evidence."
  verified_availability: false
feature_contracts:
  source_conditions:
    - "Source base universe: S&P 500 constituent; price > $1; 21-day mean dollar volume > $10 million; close > stock SMA(200); close in bottom 20% of own daily high-low range; stock RSI(2) < 20."
    - "Rank eligible stocks by 100-day historical volatility descending; at most 10 positions, 10% capital each, no margin."
    - "For next trading session place buy limits a further 0.25 times ATR(10) below prior close; exact brokerage order-validity conventions not given."
    - "Exit at next opening when RSI(2)>80 on preceding close."
    - "Added market gate for NEW positions only: calculate for each S&P 500 constituent if price makes a 3-month high or low, high count minus low count divided by current constituent count; simple 40-day moving average above 5% allows entries, otherwise skip new positions."
  availability_note: "All conditions require point-in-time and adjustment verification; not calculated in this intake"
