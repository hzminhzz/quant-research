economic_thesis:
  SOURCE_FACT: "Official summaries report UK government bond yields rising over two pre-announcement days, strongest in periods with new gilt issuance."
  AUTHOR_REPORTED_UNVERIFIED: "Authors attribute the yield drift mainly to term premia as dealer inventory constraints reduce dealer accumulation before news, with composition of liquidity providers shifting."
  LOCAL_INFERENCE: "Publicly scheduled issuance combined with pre-news inventory aversion could put temporary downward pressure on UK cash-gilt prices."
  null: "Issuance-conditioned pre-news gilt price drift fails to exceed duration-matched event controls after realizable costs."
mechanism:
  SOURCE_FACT: "Dealers avoid carrying inventory when new bond supply arrives shortly before information risk; more passive buyers replace hedge funds during these windows."
  counterparty: "Bond dealers, hedge funds and passive buyers described by authors; marginal tradable counterparty remains UNKNOWN."
