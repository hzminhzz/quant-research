cost_assumptions:
  publisher: UNKNOWN historical fee, spread and slippage assumptions.
  proposed_screen: Broker commissions plus exchange/clearing fees, entry ask, exit bid, adverse buy-stop gaps and slippage; justify inputs before any calculation.
  financing: NQ futures basis and explicit roll accounting, not crypto funding, ETF costs or CFD swaps.
  data_limitation: Historical 1-hour OHLC is not a fill-price or realized-cost record.
baseline:
  primary: Unconditional long NQ on Mondays with identical entry decision boundary, exit time, notional and cost model; compare net incremental filled-event economics using matched dates.
  identification: The baseline distinguishes stop-trigger drift from ordinary Monday Nasdaq beta.
development_evaluation:
  source_evidence: Original author says 15 years hourly NQ, in-sample plus out-of-sample checks, proprietary 72 percent audit, near-100 percent parameter-neighbor robustness; unsuccessful other-index validation.
  unavailable_details: Exact dates, trade count, loss years, max drawdown, Sharpe, PnL and historical fees were not published.
  phase3_design: FILL_DEPENDENT_EVENT. Cross-sectional IC NOT_APPLICABLE; 1-hour high crossing cannot establish stop order fill or post-entry return.
  phase3_prebacktest: Calendar, bar/ATR/Bollinger parity, causal order placement, timestamp and available bid-ask coverage verification without market returns.
  later_smallest_native_probe: Require separate approval; one NQ contract stream, exact author clock, one genuine native stop-order lifecycle, development-only data and frozen control with no parameter tuning.
  selection_bias: Author describes Monday selection after mapping weekdays; related article tested 1800 Bollinger configurations. Treat historical audit as selected evidence, not independent OOS.
  holdout: SEALED, never inspected during this task.
primary_falsifier:
  future_test: The upper one-sided 95 percent confidence bound of the conservative-cost incremental mean per correctly filled event against time-matched control is at or below zero.
  dependence: Cluster Monday events by week; do not treat hourly bars as independent returns.
  failure_classification: Use INCONCLUSIVE for insufficient events or wide intervals; BLOCKED_DATA for unresolved source clock or lack of executable quotes.
acceptance_and_stop_rules:
  admission: A two-file research description is not an executable CandidateSpec and grants no permission for native strategy testing.
  prerequisites:
    - Verify the article timezone, complete bar convention and stop expiration from original platform code or author.
    - Qualify actual NQ historical contract months, exchange calendar and fill-grade market data.
    - Predeclare costs, fee/slip robustness assumptions, and chronological evaluation exposure.
    - Inspect installed native ML4T order interface and independently test exact stop/fill/accounting parity.
  stop: No return computation, Phase 3 economics, Phase 4 backtest, holdout access, order or deployment in this discovery task.
parity_and_causality_tests:
  - Independently compare Bollinger and ATR outputs on completed bars with native output and source conventions.
  - Append future bars or alter future quotes and require preceding signals and orders unchanged.
  - Assert no fill on the bar used to construct the signal; expire or cancel as source requires.
  - Check DST, Globex weekend, holidays, missing bars, scheduled maintenance, quarterly futures rolls and exit eligibility.
  - For a separately approved native probe verify adverse stop gaps, tick rounding, bid-ask cost accounting and matched baseline treatment.
known_adaptations:
  - Potential population standard deviation and completed-bar math are proposed interpretations, not verified author formulas.
  - One-contract research normalization and conditional matched Monday control are locally proposed evaluation rules.
  - Product identity remains NQ futures; no CFD, ETF, MNQ or perp adaptation is asserted.
verified_facts:
