economic_thesis:
  question: Does a Monday stop-buy through a volatility-adjusted lower-Bollinger anchor predict positive post-trigger NQ price continuation beyond costs?
  null: Conditional cost-adjusted filled-event performance does not beat an otherwise identical time-matched Monday long-NQ control.
  scope: Descriptive entry and exit hypothesis only; historical performance is unverified.
mechanism:
  hypothesis: Monday repricing and buy-side liquidity demand could cause continuation once a band-plus-ATR price is crossed.
  prospective_counterparty: Later liquidity-demanding buyers and short covering; no actual order-flow observation exists.
  confounds:
    - Positive Nasdaq index beta and intraday long drift.
    - Monday subset chosen after inspecting weekday effects.
    - Selection among many Bollinger and ATR parameter trials.
    - Recent-regime concentration and non-generalization across indexes.
instruments:
  original:
    venue: CME Globex
    product: E-mini Nasdaq-100 quarterly futures contract
    symbol: NQ
    interval: 60-minute
    trading_currency: USD
  proposed:
    product: SAME_NQ_FUTURES_ONLY
    not_equivalent: QQQ, MNQ, cash index and cash-index CFD are not authorized source substitutions.
    contract_multiplier: CME states USD 20 per index point and minimum tick 0.25 index point.
data_requirements:
  indispensable:
    - Actual contract-month NQ 60-minute OHLC with historical session boundaries and explicit roll identities.
    - Intrabar timestamped bid and ask quotes or authoritative order/trade events to determine stop eligibility, trigger and executable exit.
    - Historical CME calendar, maintenance pause, early closes, US DST transitions, and contract expiry.
    - Verified commissions, exchange fees, spread, stop-buy slippage, adverse gaps, and price-limit restrictions.
  availability: No fill-grade NQ bid-ask or specific roll-feed provenance verified.
  local_proxy_warning: Local AGENTS.md mentions price-only NQ 1-second data; this is not proof of executable futures prices.
  protected_data: Do not read any sealed or protected partitions.
feature_contracts:
  source_parameters:
    band: lower Bollinger Band, 10 bars, one standard deviation
    volatility: ATR of 5 bars
    buffer: plus 0.8 times ATR5
  proposed_causal_math:
    lower_band: Mean of the ten most recently completed hourly closes minus one standard deviation of those closes.
    true_range: max(high-low, abs(high-previous_close), abs(low-previous_close)) using completed hourly bars.
    atr_smoothing: UNKNOWN; SMA and Wilder smoothing are distinct and must be reconciled with author platform before freezing.
    band_stdev: UNKNOWN whether population/sample deviation and platform offset.
    trigger: lower_band_t + 0.8 * ATR5_t, with stop order placed only after bar t closes for possible fill in bar t+1.
  parity_status: NOT_NATIVE_VERIFIED; candidate math cannot be called original platform code.
strategy_rules:
  ORIGINAL_AUTHOR_RULES:
    direction: long-only as implied by a buy stop
    entry_level: lower_Bollinger_10_1sigma plus 0.8 times ATR5
    order: stop entry, activated only when hit in the following hour
    filter: Monday only
    entry_window: 00:00 to 23:00, timezone NOT published
    exit: 23:00 on the same Monday, timezone NOT published
    instrument: NQ futures, 60-minute bars
    order_cancel_stop_and_sizing: No exact rules published for expiry/rearming, loss stop, profit target or risk allocation.
  researcher_constraints:
    - No assumed same-bar stop fill or favorable gap execution.
    - No imported 1.8 ATR setting from a different July 8 strategy.
    - No invented session timezone or missing exit data.
