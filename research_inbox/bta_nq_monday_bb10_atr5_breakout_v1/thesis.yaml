  - Primary BTA article itself reports 15 years, IS/OOS validation, 72 percent audit, near-100 percent space robustness and adverse cross-index findings; these are unverified SOURCE CLAIMS.
  - July 8 BTA article tests a distinct 1.8 ATR choice, reporting 1800 screened strategy variants, and cannot corroborate the exact 0.8 ATR performance.
  - CME official publication specifies the NQ futures product; source URL existence does not prove vendor historical fill data.
assumptions:
