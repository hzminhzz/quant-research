economic_thesis:
  mechanism: Nonlinear conditional dependence of cointegrated cryptocurrency price spreads may create temporary pairwise dislocations.
  source_claimed_strategy: "Fit stationary BTCUSDT-minus-beta-altcoin spreads on 20 USDT-margined futures; filter Engle-Granger/KSS cointegration, rank with Kendall tau, trade two selected altcoins as opposite legs using copula conditional probabilities. BTC is a reference, not a trading leg; three-week formation and one-week trading with hourly conditional mispricing observations."
