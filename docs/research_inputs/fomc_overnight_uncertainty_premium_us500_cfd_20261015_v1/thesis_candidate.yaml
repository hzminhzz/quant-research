    - dataset: canonical_dukascopy_us500_1m
      frequency: 1m
      raw_columns: [symbol, timestamp, open, high, low, close]
      historical_price_side: bid_only_reported
      optional_columns_not_used_for_signal: [volume]
      quote_data_requirements_for_costs: [historical_ask_or_spread, historical_slippage_evidence]
      timestamp_convention: bar_start_UTC
      bar_availability: At the end of its full 60-second interval, never at bar start.
      data_coverage_proposal: '[2017-01-01T00:00:00Z, 2025-01-01T00:00:00Z)'
      coverage_verified_for_required_event_bars: false
    - dataset: official_historical_fomc_scheduled_statement_calendar
      frequency: event
      raw_columns: [scheduled_statement_date_et, originally_announced_at_utc, event_kind, status_asof_entry]
