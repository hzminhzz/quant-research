economic_thesis:
  statement: >-
    Scheduled Federal Reserve policy decisions concentrate uncertainty in US equities.
    Bearing S&P 500 exposure from after the prior cash-market close to just after
    the next cash-market open may earn a positive incremental risk premium over an
    ordinary matched overnight exposure after executable CFD expenses.
  economic_null: >-
    Mean matched incremental after-cost return of the FOMC overnight exposure
    is less than or equal to zero; positive general equity overnight carry alone
    does not constitute the proposed edge.
  direction: long_only
  horizon: overnight_before_scheduled_statement
  independent_portfolio_alpha: not_established
mechanism:
  behavior: Possible concentration of expected equity compensation before a scheduled policy announcement.
  primary_actors: Risk-averse equity holders, macro hedgers, and institutions rebalancing event exposure.
  who_pays: 'INFERENCE: sellers and hedgers prepared to forgo upside to reduce pre-announcement exposure.'
  persistence: 'HYPOTHESIS: systematic event risk can require compensation even if timing is widely known.'
  supports: Greater ex-ante monetary uncertainty with adequate overnight tradability.
  destroys: Highly anticipated announcements, structural transparency changes, lack of premium, widened spreads and financing.
  distinct_from_trend_or_reversion: Fixed ex-ante event clock; neither momentum nor price mean reversion supplies the signal.
  alternative_explanations:
    - Ordinary equity overnight beta rather than FOMC-specific exposure.
    - Pre-announcement premium entirely in the daylight interval omitted here.
    - Source or broker session artifacts around the overnight maintenance break.
    - Selection from a well-published historical anomaly.
  evidence_status: >-
    Historical pre-FOMC returns are VERIFIED in cited studies. The risk-bearing
    counterpart and current executable CFD excess returns are untested HYPOTHESES.
