# Declaration example only: not an executable strategy or validated cost model.
# Fill the exact venue/product mapping and data before freezing a research session.
session_id: crypto-example
market: crypto
thesis: >-
  Provisional hypothesis: extreme positive perpetual funding predicts subsequent
  price reversal, relative to a no-trade baseline, after all execution and funding costs.
mechanism: >-
  Crowded leveraged longs may pay funding and unwind after financing pressure.
  Persistent directional demand could overwhelm this proposed reversal effect.
falsifier: >-
  Reject if chronological development trials do not improve on the no-trade
  baseline net of verified costs, or the effect depends on unavailable funding information.
instruments:
  - symbol: UNMAPPED_BTC_PERPETUAL
    kind: perpetual
    # venue intentionally omitted: check must report missing_venue.
    # Supply venue and identity with exact contract, quote/settlement currency,
    # multiplier, tick/lot, margin and shorting constraints. Never infer from BTCUSD.
data:
  - id: prices
    symbol: UNMAPPED_BTC_PERPETUAL
    role: prices
    path: data/research_sessions/crypto_prices.parquet
  - id: funding
    symbol: UNMAPPED_BTC_PERPETUAL
    role: funding
    path: data/research_sessions/crypto_funding.parquet
evaluation:
  development_start: "2027-01-01T00:00:00Z"
  development_end: "2027-02-01T00:00:00Z"
  holdout_start: "2027-02-01T00:00:00Z"
  plan: >-
    Illustrative future boundaries, not a claimed unseen sample. Replace before
    init with justified chronological folds, overlap purge/embargo and a frozen
    final-test rule; diagnose uses only the half-open development interval.
baseline: No trade; zero strategy return before any cash financing assumptions.
costs:
  commission_bps: 0
  slippage_bps: 0
  assumptions: >-
    Unfilled numeric placeholders, not free trading. Replace with dated venue/tier
    fees, spread/impact stress, signed timestamped funding, borrow when applicable,
    and margin/liquidation assumptions before interpreting strategy economics.
trials:
  - id: development-summary
    kind: diagnostic
    description: Bounded descriptive development data summary; no strategy or holdout score.
  - id: thesis-baseline
    kind: preregistered
    description: Proposed economic baseline comparison; execute separately after completing the specification.
  - id: legacy-review
    kind: historical_review
    description: Link the existing ORB NOT_APPROVED decision; no crypto evidence or retrospective preregistration.
    artifact: run_log/validation_status.json
