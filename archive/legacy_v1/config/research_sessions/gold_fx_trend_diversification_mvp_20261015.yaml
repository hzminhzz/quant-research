evaluation:
  mode: MVP Research
  cadence: completed NY 17:00 CFD quote-session bars
  warmup_start: '2013-01-01T00:00:00Z'
  development_start: '2015-01-01T00:00:00Z'
  development_end: '2022-01-01T00:00:00Z'
  holdout_start: '2025-01-01T00:00:00Z'
  selection_2022_2024: >-
    This previously observed historical period is not treated as unseen.
    XAUUSD 2022-2024 has incomplete coverage (224/185/155 eligible sessions).
    Do not use 2022-2024 for the primary three-market comparable verdict.
  protected_allocation_2025_2026: LOCKED
  feature: native ml4t.engineer ROC(period=60) on same-symbol completed daily close
  decision: after each first completed session in a calendar month
  execution: native ml4t.backtest.Engine NEXT_BAR; next observed tradable open
  risk: each stand-alone instrument at 10 percent equity notional, no optimization
  exit: switch or close on next monthly signal, no intraday stop inferred
  guard: >-
    If a source session gap exceeds the certified limit, do not treat missing
    bars as tradable. Do not forward-fill prices for orders. Incomplete daily
    samples remain visible in the data qualification artifact.
  portfolio_stage: >-
    Only after individual cash/equity/fill audit, compare synchronized daily
    marked-equity with unchanged incumbents at matched volatility. Do not
    open reserved 2025-2026 evaluation to do this.

baseline: >-
  Cash/no-trade for each instrument. Descriptive buy-and-hold is secondary.
  A matched 2015-2021 comparison is required; no per-year equity reset.
costs:
  commission_bps: 2.0
  slippage_bps: 3.0
  assumptions: >-
    Exploratory placeholder per side, not broker-certified. Bid/ask spread
    quotes, CFD overnight financing, rollover and swaps are unavailable in
    this research snapshot and must remain explicit blockers to deployment.
  stress_rule: 2x combined friction only after preregistered baseline has
    passed process-validity checks; count as an additional documented trial.

trials:
  - id: xau_tsmom_60_mvp
    kind: preregistered
    description: Native-ROC60 sign, monthly long/short XAUUSD CFD proxy, 2015-2021.
  - id: eur_tsmom_60_mvp
    kind: preregistered
    description: Native-ROC60 sign, monthly long/short EURUSD CFD proxy, 2015-2021.
  - id: aud_tsmom_60_mvp
    kind: preregistered
    description: Native-ROC60 sign, monthly long/short AUDUSD CFD proxy, 2015-2021.

evidence:
