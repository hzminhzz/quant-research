# Development-only Gold / major-FX macro-trend diversification research.
# The session is NOT an approval for backtests, optimization, promotion, or live trading.
session_id: gold_fx_trend_diversification_mvp_20261015
market: fx

thesis: >-
  A fixed 60-completed-session own-price trend sign on Gold, EUR/USD and
  AUD/USD may produce positive net monthly-position returns from slow macro
  repricing. Gold and major FX may add distinct daily return exposures to
  the existing NQ/ES/BTC-heavy portfolio. Compare each instrument against
  cash, then assess contribution only after individual native execution passes.
mechanism: >-
  Monetary-policy repricing, capital reallocation, hedging demand and
  institutional adjustment can persist for months. The effect should break
  during choppy range-bound periods, abrupt macro reversals, regime transitions
  and when CFD spread, slippage and financing exceed price persistence.
falsifier: >-
  This is a fixed, no-search MVP. REJECT any candidate with no positive
  development net daily-equity Sharpe after declared costs or with a major
  clock/data/ledger error. Consider a VALIDATE recommendation only if at
  least two of three stand-alone candidates earn positive net expectancy
  across more than one subperiod, the matched common-window equal-risk mix
  beats cash net of costs, and downside/turnover statistics remain credible.
  An inconclusive period or missing broker swap data is not a pass.
  Do not select candidates by observed historical maximum Sharpe.

instruments:
  - symbol: XAUUSD
    kind: cfd
    venue: Dukascopy historical quote feed, not a named executable account
    identity: Gold quoted as USD per troy ounce, canonical forex_minute_XAUUSD; broker CFD terms unverified
    session: broker quote session, daily close approx 17:00 America/New_York
    timezone: America/New_York
  - symbol: EURUSD
    kind: cfd
    venue: Dukascopy historical quote feed, not a named executable account
    identity: EUR/USD quote denominated USD, canonical forex_minute_EURUSD; broker CFD terms unverified
    session: FX 24/5, daily close approx 17:00 America/New_York
    timezone: America/New_York
  - symbol: AUDUSD
    kind: cfd
    venue: Dukascopy historical quote feed, not a named executable account
    identity: AUD/USD quote denominated USD, canonical forex_minute_AUDUSD; broker CFD terms unverified
    session: FX 24/5, daily close approx 17:00 America/New_York
    timezone: America/New_York

