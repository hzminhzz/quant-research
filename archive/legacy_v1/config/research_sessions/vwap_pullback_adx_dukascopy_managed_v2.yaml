  development_end: "2026-07-01T00:00:00Z"
  holdout_start: "2026-11-01T00:00:00Z"
  retrospective_data_already_seen: true
  strategy_exit: 15:14 America/Chicago next-open, after 15:13 decision
baseline: B0 cash. All B1/B2/B3 historical observations predate managed migration.
costs:
  commission_bps: 0
  slippage_bps: 0
  assumptions: >-
    The schema bps fields are 0 placeholders; separately specified native
    historical stress variants use illustrative NQ-equivalent 20 USD/point,
    $2.50/side, and 0/0.25/0.50/1.0-point adverse market/stop slippage.
    No verified Dukascopy broker contract multiplier or live execution costs.
