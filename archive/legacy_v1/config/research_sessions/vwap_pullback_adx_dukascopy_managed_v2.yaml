session_id: vwap_pullback_adx_dukascopy_managed_v2
thesis: >-
  Historical engineering and execution parity for already-observed B1/B2/B3
  Dukascopy USATECH CFD 2026 development. This is NOT a new independent alpha test.
mechanism: >-
  Cash-opening-range continuation with optional quote-volume VWAP reclaim and
  native ADX14 gate. Native Engine must match original source-specific 15:14 CT
  liquidation and conservative stop-first order semantics.
falsifier: >-
  Any source/feature/session/recorded-signal parity mismatch or unsafe native
  fill invalidates this migration. Observed profitability is not acceptance.
market: indices
instruments:
  - symbol: DUK_USATECH
    kind: cfd
    identity: Dukascopy USATECH.IDX/USD historical broker price and quote-volume proxy
    session: 08:30-15:14 America/Chicago exact source bar opens
    timezone: America/Chicago
data:
  - id: dukascopy_cfd_1m
    path: data/processed/vwap_adx_dukascopy_2026_1m.parquet
    role: prices
evaluation:
