schema_version: 1
spec_kind: time_series
sleeve_id: af30_s21_breakout
selection_family_id: af30_time_series
book_strategy: 21
thesis: A close beyond the prior 20-bar high or low tests channel-breakout continuation.
market_classes:
- name: indices
  symbols:
  - DAX
  - ES
  - EUSIDXEUR
  - HK33
  - NIKKEI225
  - NQ
  panel_root: data/vault/markets_20261015/index_1h
  bar_seconds: 3600
  periods_per_year: 252
  carry:
    mode: modeled
    curve: bonds_daily_US10Y
    tenor: US10Y
- name: metals
  symbols:
  - XAUUSD
  - XAGUSD
  panel_root: data/vault/markets_20261015/metals_1h
  bar_seconds: 3600
  periods_per_year: 252
  carry:
    mode: modeled
    curve: bonds_daily_US10Y
    tenor: US10Y
- name: crypto
  symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  panel_root: data/vault/crypto_perps_1h
  bar_seconds: 3600
  periods_per_year: 365
  carry:
    mode: observed
windows:
  train:
    start: '2020-04-01T00:00:00Z'
    end: '2024-01-01T00:00:00Z'
  validation:
    start: '2024-01-01T00:00:00Z'
    end: '2026-01-01T00:00:00Z'
  protected:
    start: '2026-01-01T00:00:00Z'
    end: '2026-10-01T00:00:00Z'
features:
- name: atr_14
  native: atr
  params:
    period: 14
- name: vol_240
  expr:
    op: rolling_std
    args:
    - op: pct_change
      args:
      - op: col
        name: close
    window: 240
    min_samples: 60
- name: upper_20
  expr:
    op: rolling_max
    args:
    - op: col
      name: high
    window: 20
    min_samples: 20
- name: upper_prev
  expr:
    op: shift
    args:
    - op: col
      name: upper_20
    periods: 1
- name: lower_20
  expr:
    op: rolling_min
    args:
    - op: col
      name: low
    window: 20
    min_samples: 20
- name: lower_prev
  expr:
    op: shift
    args:
    - op: col
      name: lower_20
    periods: 1
- name: breakout_up
  expr:
    op: div
    args:
    - op: sub
      args:
      - op: col
        name: close
      - op: col
        name: upper_prev
    - op: col
      name: close
- name: breakout_down
  expr:
    op: div
    args:
    - op: sub
      args:
      - op: col
        name: close
      - op: col
        name: lower_prev
    - op: col
      name: close
- name: breakout
  expr:
    op: where
    args:
    - op: gt
      args:
      - op: col
        name: close
      - op: col
        name: upper_prev
    - op: col
      name: breakout_up
    - op: where
      args:
      - op: lt
        args:
        - op: col
          name: close
        - op: col
          name: lower_prev
      - op: col
        name: breakout_down
      - op: lit
        value: 0.0
forecast:
  feature: breakout
  horizon_bars: 1
  scaling:
    kind: bounded_linear
    scale: 0.02
    cap: 20.0
volatility_target: 0.1
risk_allocation:
  method: inverse_volatility
  per_instrument_cap: 0.35
  gross_exposure: 1.0
  volatility_feature: vol_240
stops:
  feature: atr_14
  multiple: 3.0
rebalance_bars: 24
costs:
  commission_bps_one_way: 1.0
  slippage_bps_one_way: 2.0
  spread_bps: 0.0
  spread_included_in_slippage: true
label_horizon_bars: 1
assumptions:
- Prices are research proxies, not exchange-certified tradable contracts.
- Modeled financing requires binding the carry sidecar rate into carry_rate before
  feature compilation.
- The crypto panel root must be materialized from the local store before a run.
- Costs are declared assumptions, not observed venue spreads.
- Row-based rolling windows span observed bars, not wall-clock time; session-bound
  index and metal feeds have gaps.
