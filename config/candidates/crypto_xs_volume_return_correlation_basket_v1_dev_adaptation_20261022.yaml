schema_version: 1
candidate_id: ats_crypto_xs_volume_return_corr_dev_adaptation_20261022
selection_family_id: cross_sectional_risk_premia
market_scope: BINANCE_UM_USDT_PERP
source_spec_status: local_adaptation
thesis: >-
  Test whether altcoins whose hourly returns co-move positively with hourly volume
  changes over trailing 14 days reflect volume-confirmed institutional accumulation that
  continues over the next 72 hours. Source direction: long high-correlation, short
  negative-correlation tokens in a 72-hour dollar-neutral basket. Adapted from
  research_inbox/crypto_xs_volume_return_correlation_basket_v1.
panel_root: /home/quant/.devspace/worktrees/quant-research-25440f7a/data/vault/full_530_20261015
windows:
  train: {start: '2020-04-01T00:00:00Z', end: '2024-01-01T00:00:00Z'}
  validation: {start: '2024-01-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
  protected: {start: '2026-01-01T00:00:00Z', end: '2026-10-01T00:00:00Z'}
universe:
  top_n: 40
  minimum_assets: 40
  lookback_bars: 720
  minimum_history_bars: 720
  minimum_dollar_volume: 0
features:
  - name: atr_24h
    native: atr
    params: {period: 24}
  - name: ret_1h
    expr: {op: pct_change, periods: 1, args: [{op: col, name: close}]}
  - name: volume_diff_1h
    expr: {op: diff, periods: 1, args: [{op: col, name: volume}]}
  - name: mean_volume_336h
    expr:
      op: rolling_mean
      window: 336
      args: [{op: col, name: volume}]
  - name: volume_denominator
    expr:
      op: where
      args:
        - {op: gt, args: [{op: col, name: mean_volume_336h}, {op: lit, value: 1.0e-9}]}
        - {op: col, name: mean_volume_336h}
        - {op: lit, value: 1.0e-9}
  - name: volume_change_normalized
    expr:
      op: div
      args:
        - {op: col, name: volume_diff_1h}
        - {op: col, name: volume_denominator}
  - name: return_volume_product
    expr:
      op: mul
      args:
        - {op: col, name: ret_1h}
        - {op: col, name: volume_change_normalized}
  - name: mean_return_336h
    expr:
      op: rolling_mean
      window: 336
      args: [{op: col, name: ret_1h}]
  - name: mean_volume_change_336h
    expr:
      op: rolling_mean
      window: 336
      args: [{op: col, name: volume_change_normalized}]
  - name: mean_product_336h
    expr:
      op: rolling_mean
      window: 336
      args: [{op: col, name: return_volume_product}]
  - name: return_volume_covariance_336h
    expr:
      op: sub
      args:
        - {op: col, name: mean_product_336h}
        - op: mul
          args:
            - {op: col, name: mean_return_336h}
            - {op: col, name: mean_volume_change_336h}
  - name: std_return_336h
    expr:
      op: rolling_std
      window: 336
      args: [{op: col, name: ret_1h}]
  - name: std_volume_change_336h
    expr:
      op: rolling_std
      window: 336
      args: [{op: col, name: volume_change_normalized}]
  - name: correlation_denominator
    expr:
      op: mul
      args:
        - {op: col, name: std_return_336h}
        - {op: col, name: std_volume_change_336h}
  - name: correlation_denominator_floor
    expr:
      op: where
      args:
        - {op: gt, args: [{op: col, name: correlation_denominator}, {op: lit, value: 1.0e-12}]}
        - {op: col, name: correlation_denominator}
        - {op: lit, value: 1.0e-12}
  - name: volume_return_correlation_336h
    expr:
      op: div
      args:
        - {op: col, name: return_volume_covariance_336h}
        - {op: col, name: correlation_denominator_floor}
  - name: momentum_baseline_168h
    expr:
      op: sub
      args:
        - op: div
          args:
            - {op: col, name: close}
            - {op: shift, periods: 168, args: [{op: col, name: close}]}
        - {op: lit, value: 1.0}
signal: volume_return_correlation_336h
baseline: momentum_baseline_168h
allocation:
  long_count: 5
  short_count: 5
  gross_exposure: 1.0
  rebalance_bars: 72
  atr_feature: atr_24h
  atr_multiple: 3.0
  timing_lag: 1
  netting_rule: weight_delta
costs:
  commission_bps_one_way: 5.0
  slippage_bps_one_way: 4.0
  spread_bps: 0.0
  spread_included_in_slippage: true
gates:
  minimum_ic: 0.015
  minimum_hac_t: 2.0
  minimum_ic_observations: 30
  require_baseline_ic_improvement: true
  dsr_probability: 0.95
  maximum_abs_beta: 0.15
  maximum_short_stop_fraction: 0.20
  minimum_completed_trades: 1500
  require_baseline_sharpe_improvement: true
  minimum_daily_observations: 365
label_horizon_bars: 72
bar_seconds: 3600
periods_per_year: 365
benchmark: BTCUSDT_PERP
initial_cash: 100000
seed: 42
cutoff_checks: 3
prior_trial_ids: []
assumptions:
  - >-
    SOURCE_ID=research_inbox/crypto_xs_volume_return_correlation_basket_v1/thesis.yaml
    SHA256=f3f8935f36a381b147efb65077495954a728b1c010e454888e9fee029edffae8;
    brief.md SHA256=8ea38560988c254ad1c197bc3c728c6d016fe1da36417dca79fd98c72ff39b51.
    The source is a descriptive thesis, not a validated executable rule; its citations are
    not evidence that these formulas reproduce the cited papers.
  - >-
    SOURCE FACTS PRESERVED: 1h Binance USDT perpetual bars; Top-40 liquid PIT universe;
    72-hour rebalanced dollar-neutral basket; long high-correlation / short negative-
    correlation; return-versus-volume-change association over trailing 14 days; 5 bps
    taker + 4 bps slippage per leg; 3x ATR(24) frozen stop; HAC>=2.0 and DSR>0.95
    falsifiers; declared window boundaries.
  - >-
    RESEARCHER CHOICES (not in the source): the source says Spearman rank correlation,
    but the declarative grammar has no time-series rank, so this implements Pearson
    correlation of hourly simple returns with volume changes normalised by trailing
    336h mean volume. This is a deliberate, documented estimator substitution and can
    change the measured association; it is not a Spearman replication. Volume change is a
    first difference of base-traded quantity, not quote notional, because the snapshot's
    only volume field is base quantity. The denomination and correlation floors
    (1e-9, 1e-12) are researcher guards.
  - >-
    CLOCK: bar timestamp t is the bar OPEN. Features on bar t are usable after it closes;
    the allocator rebalances when the bar epoch is 0 modulo 72h from train start, so a
    00:00 UTC decision bar fills at the 01:00 UTC next-bar open. The source's 00:01
    same-bar clock is replaced explicitly. No order uses its own entry bar's high/low.
  - >-
    BASELINE CHOICE: the source offers an equal-weight universe basket or buy-and-hold,
    neither of which is a ranked feature. A 168h cross-sectional momentum baseline makes
    the comparison a competing signal rather than a constant score; this is a researcher
    departure and makes require_baseline_ic_improvement stricter, not weaker.
  - >-
    UNIVERSE: 40 highest trailing-720h close*base_volume names of the 530 snapshotted
    symbols; 720 uninterrupted tradable bars required; minimum_assets=40 so the runtime
    abstains rather than narrowing. Turnover is proxied by base quantity x close, and
    delisting completeness of the archive is unknown.
  - >-
    COSTS/CARRY: 5 bps one-way commission plus 4 bps one-way slippage with spread 0 and
    included in slippage (no double charge). Funding is the observed settled carry_rate
    impulse from the snapshot; absent funding is not treated as zero. No crypto spread was
    measured and the 530-symbol manifest carries no aggregate execution_qualified key
    (per-entry provenance records execution_qualified=false). Stage 3 therefore reports
    MODELED-COST development economics, not venue execution qualification.
  - >-
    WINDOWS: snapshot begins 2020-01-01, so train starts 2020-04-01 after 720h warmup;
    validation ends 2026-01-01; no protected row is read, claimed or simulated.
  - >-
    MULTIPLICITY: prior_trial_ids is empty because the earlier same-scope, same-horizon
    trials in the shared ledger produced no daily-return artifacts and cannot enter an
    aligned DSR cohort; the factory still counts every registered attempt in
    (market_scope, label_horizon_bars). The native DSR gate also requires >=10 prior
    attempts and >=10 return-aligned priors, which this workspace lacks, so Stage 3 is
    expected to be INCONCLUSIVE on DSR evidence even if economics are favourable. That is
    reported, not worked around.
  - >-
    DEVELOPMENT ONLY: executed with --development-only against a certified development
    partition. No holdout claim, Stage 4, promotion, deployment or live trading.
