schema_version: 1
candidate_id: ats_crypto_xs_90d_high_anchoring_local_adaptation_20261018
selection_family_id: cross_sectional_risk_premia
market_scope: BINANCE_UM_USDT_PERP
source_spec_status: local_adaptation
thesis: >-
  Test whether the point-in-time cross-sectional rank of close divided by the
  trailing 2160-hour high predicts next-open 72-hour returns for Binance USDT
  perpetuals. This is a local adaptation of the 90-day-high anchoring handoff.
panel_root: /tmp/ats-crypto-xs-90d-high-anchoring-development
windows:
  train: {start: '2020-04-01T00:00:00Z', end: '2024-01-01T00:00:00Z'}
  validation: {start: '2024-01-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
  protected: {start: '2026-01-01T00:00:00Z', end: '2026-10-01T00:00:00Z'}
universe:
  top_n: 40
  minimum_assets: 40
  lookback_bars: 720
  minimum_history_bars: 720
  minimum_dollar_volume: 0
features:
  - name: atr_24h
    native: atr
    params: {period: 24}
  - name: high_90d
    expr:
      op: rolling_max
      window: 2160
      args: [{op: col, name: high}]
  - name: high_watermark_ratio
    expr:
      op: div
      args:
        - {op: col, name: close}
        - {op: col, name: high_90d}
  - name: high_watermark_rank
    expr: {op: xs_rank, args: [{op: col, name: high_watermark_ratio}]}
  - name: momentum_72h_baseline
    expr:
      op: pct_change
      periods: 72
      args: [{op: col, name: close}]
signal: high_watermark_rank
baseline: momentum_72h_baseline
allocation:
  long_count: 5
  short_count: 5
  gross_exposure: 1.0
  rebalance_bars: 72
  atr_feature: atr_24h
  atr_multiple: 3.0
  timing_lag: 1
  netting_rule: weight_delta
costs:
  commission_bps_one_way: 5.0
  slippage_bps_one_way: 4.0
  spread_bps: 0.0
  spread_included_in_slippage: true
gates:
  minimum_ic: 0.0
  minimum_hac_t: 2.0
  minimum_ic_observations: 30
  require_baseline_ic_improvement: true
  dsr_probability: 0.95
  maximum_abs_beta: 0.15
  maximum_short_stop_fraction: 0.2
  minimum_completed_trades: 1500
  require_baseline_sharpe_improvement: true
  minimum_daily_observations: 365
label_horizon_bars: 72
bar_seconds: 3600
periods_per_year: 365
benchmark: BTCUSDT_PERP
initial_cash: 100000
seed: 42
cutoff_checks: 3
