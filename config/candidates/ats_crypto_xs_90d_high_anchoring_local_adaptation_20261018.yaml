assumptions:
  - >-
    SOURCE_ID=origin/feat/ats-inbox-62-copy-20261018:research_inbox/crypto_xs_90d_high_anchoring_basket_v1/thesis.yaml
  - SOURCE_SHA256=0a64270bef0c43e4f11caeeb3c116d19205a1e52ae668c18a78479f06f4b4e6c
  - >-
    LOCAL_ADAPTATION: source raw history begins in 2020, so train begins 2020-04-01
    to retain a full 2160-hour high-watermark warmup; source's proposed 2019-10-01
    train start is not represented.
  - >-
    LOCAL_ADAPTATION: the nested source does not specify an executable cross-sectional
    baseline. Compare with 72-hour close momentum, an explicit conventional signal
    baseline, and require candidate IC improvement.
  - >-
    LOCAL_ADAPTATION: use the documented native convention of 5 bps one-way taker
    commission plus 4 bps one-way slippage, totaling 18 bps round trip. Separate
    spread is zero because the 4 bps slippage assumption includes spread; this is
    an assumption, not measured execution.
  - >-
    Funding marks use the documented trade_open_proxy policy when source marks are
    absent; substituted marks are labeled in the immutable panel provenance.
  - >-
    The 40-name PIT universe is ranked by trailing 720-hour close-times-volume
    proxy; source coverage and historical listing completeness remain unverified.
  - >-
    The source claims a 62-hypothesis selection family. This branch identifies 52
    cross-sectional thesis IDs including the selected source (51 prior IDs); ten
    claimed IDs have no matching thesis YAML here. Their return artifacts are also
    absent, so Stage 3 must remain blocked pending selection-family reconciliation.
  - >-
    The original source also requires low-liquidity-regime falsification, annualized
    net Sharpe >= 1, maximum drawdown <= 20%, and positive alpha after attribution.
    The current native factory gates do not encode all of these checks; any Stage 3
    result is adaptation evidence and cannot satisfy or waive those source gates.
  - >-
    Stage 1/2 are development-only. No protected partition is read and no live
    order or deployment authority is created. Existing 2026 exposure is disclosed.
