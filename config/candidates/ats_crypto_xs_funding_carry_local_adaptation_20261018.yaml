schema_version: 1
candidate_id: ats_crypto_xs_funding_carry_local_adaptation_20261018
selection_family_id: cross_sectional_risk_premia
market_scope: BINANCE_UM_USDT_PERP
source_spec_status: local_adaptation
thesis: >-
  Test whether cross-sectional 24-hour settled funding carry harvests two-sided funding
  transfers and subsequent 48-hour relative price returns on Binance USDT perpetuals.
  Adapted from Schmeling, Schrimpf & Todorov (BIS 2023) and He et al. (2026).
panel_root: /tmp/ats-crypto-xs-90d-high-anchoring-development
windows:
  train: {start: '2020-04-01T00:00:00Z', end: '2024-01-01T00:00:00Z'}
  validation: {start: '2024-01-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
  protected: {start: '2026-01-01T00:00:00Z', end: '2026-10-01T00:00:00Z'}
universe:
  top_n: 40
  minimum_assets: 40
  lookback_bars: 720
  minimum_history_bars: 720
  minimum_dollar_volume: 0
features:
  - name: atr_24h
    native: atr
    params: {period: 24}
  - name: settled_funding_24h
    expr:
      op: rolling_sum
      window: 24
      args: [{op: col, name: carry_rate}]
  - name: funding_carry_basket
    expr: {op: neg, args: [{op: col, name: settled_funding_24h}]}
  - name: momentum_48h_baseline
    expr:
      op: pct_change
      periods: 48
      args: [{op: col, name: close}]
signal: funding_carry_basket
baseline: momentum_48h_baseline
allocation:
  long_count: 5
  short_count: 5
  gross_exposure: 1.0
  rebalance_bars: 48
  atr_feature: atr_24h
  atr_multiple: 3.0
  timing_lag: 1
  netting_rule: weight_delta
costs:
  commission_bps_one_way: 5.0
  slippage_bps_one_way: 4.0
  spread_bps: 0.0
  spread_included_in_slippage: true
gates:
  minimum_ic: 0.0
  minimum_hac_t: 1.65
  minimum_ic_observations: 30
  require_baseline_ic_improvement: false
  dsr_probability: 0.95
  maximum_abs_beta: 0.15
  maximum_short_stop_fraction: 0.20
  minimum_completed_trades: 500
  require_baseline_sharpe_improvement: false
  minimum_daily_observations: 365
label_horizon_bars: 48
bar_seconds: 3600
periods_per_year: 365
benchmark: BTCUSDT_PERP
initial_cash: 100000
seed: 42
cutoff_checks: 3
prior_trial_ids: []
assumptions:
  - >-
    SOURCE_ID=origin/feat/ats-inbox-62-copy-20261018:research_inbox/crypto_xs_funding_carry_exhaustion_basket_v1/thesis.yaml
  - SOURCE_SHA256=cf51835fbcb88d5cb02ecda0b069ab9e5b23f28a5d62107e18b80ebf8aa0626f
  - >-
    LOCAL_ADAPTATION: funding carry defined as negative 24h rolling sum of carry_rate.
    Go long negative-funding tokens (receive payments) and short positive-funding tokens.
  - >-
    Baseline is 48-hour relative price momentum.
  - >-
    Modeled costs: 5 bps one-way taker commission plus 4 bps one-way slippage
    (18 bps round trip). Spread included in slippage.
  - Development-only trial. No protected partition read; holdout remains sealed.
