# Research session specification: Two-Stage Funnel TSMOM with Stop Market Order Execution
# Session ID: crypto_tsmom_two_stage_funnel_stop_exec
session_id: crypto_tsmom_two_stage_funnel_stop_exec
market: crypto

thesis: >-
  Two-Stage Funnel Time-Series Momentum (30-day volume liquidity screen + Close > EMA200 structural trend health gate
  + Risk-adjusted momentum ranking) executed via resting Stop Market breakout orders (OrderType.STOP) and volatility-targeted
  risk parity sizing achieves institutional risk-adjusted performance (Sharpe > 1.00, Max DD < 20%) across development (2021-2024)
  and out-of-sample holdout (2025-2026) after realistic execution friction and 8-hour perpetual funding cash flows.

mechanism: >-
  1. False Breakout Elimination: Gating universe by Close > EMA200 prevents buying crashing tokens during high-volume panics.
  2. Momentum Confirmation: Stop Market orders ensure capital enters only when buying momentum actively touches and breaks above
     resistance levels, confirming directional continuation before execution.
  3. Dynamic Volatility Budgeting: Inverse volatility sizing (1 / sigma_i) contracts exposure during high-risk regimes.

falsifier: >-
  Reject the thesis if:
  1. Annualized continuous daily Sharpe ratio fails to exceed 1.00 on development data.
  2. Maximum portfolio drawdown exceeds 20.0%.
  3. Out-of-sample holdout (2025-2026) fails to preserve capital relative to crypto market benchmark.
  4. Deflated Sharpe Ratio (DSR) fails to exceed 0.90 across cumulative evaluated trials.

