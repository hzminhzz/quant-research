evaluation:
  cadence: 1h
  development_start: "2021-01-01T00:00:00Z"
  development_end: "2024-12-31T23:59:59Z"
  holdout_start: "2025-01-01T00:00:00Z"
  holdout_end: "2026-07-31T23:59:59Z"
  plan: >-
    Evaluate Two-Stage Funnel TSMOM with Stop Market order execution on 4-year development data.
    Perform comparative side-by-side audit against passive maker execution.
    Holdout period (2025-01-01 to 2026-07-31) tested in Phase 3 under strict audit protocols.

baseline: >-
  10-asset equal-weight Buy-and-Hold benchmark and raw dynamic TSMOM baseline.

costs:
  commission_bps: 4.5
  slippage_bps: 1.5
  funding_included: true
  assumptions: >-
    Binance USD-M Futures VIP 0 taker fee of 4.5 bps with BNB discount plus 1.5 bps slippage per side (12.0 bps roundtrip)
    for Stop Market orders that cross the spread upon breakout trigger.
    Signed 8-hour perpetual funding rate cash flows applied at settlement marks.

trials:
  - id: trial_1_two_stage_funnel_stop_market
    kind: preregistered
    description: >-
      Two-Stage Funnel TSMOM with Stop Market breakout order execution (OrderType.STOP at Close * 1.002)
      under taker friction (4.5 bps fee, 1.5 bps slippage).
  - id: trial_2_two_stage_funnel_passive_maker
    kind: preregistered
    description: >-
      Two-Stage Funnel TSMOM under passive maker execution (1.8 bps maker fee, 0.0 bps slippage).
  - id: trial_3_stop_market_sensitivity_sweep
    kind: preregistered
    description: >-
      Sensitivity analysis varying Stop Market breakout trigger offset (0.1% to 0.5% above previous close).
  - id: trial_4_holdout_and_dsr_audit
    kind: diagnostic
    description: >-
      19-month out-of-sample holdout simulation and Deflated Sharpe Ratio (DSR) multiple-testing accounting.
