session_id: fx_support_conditions_20261008_ml_v2
market: fx
thesis: >-
  A fixed low-capacity LightGBM classifier may recognize support-retest
  events that break a prior significant high before the first subsequent
  30-minute close below origin support within 240 complete 30-minute bars.
  This is a versioned technical retry after a single 2010 warm-up feature
  value blocked the first preregistered execution before model fitting.
mechanism: >-
  The quality of renewed buying near launch support may depend on candle
  strength, recent directional persistence, ATR regime, relative EMA trend,
  and the distance to the significant high. A low-capacity supervised
  classifier can test nonlinear interactions, but cannot prove profitability.
falsifier: >-
  Require at least 100 selected out-of-fold development events and 20 per
  pair, at least 35 percent prior-high-before-support-close outcomes, at
  least 8 percentage points lift over unfiltered support holds in the same
  2017-2024 validation cohort, monthly clustered 95 percent interval lower
  bound above that cohort baseline, and improvement over baseline in at
  least two pairs. Additionally require selected event precision above
  each validation fold's base rate in at least three of four expanding
  folds, and lower Brier score than the constant training-positive-rate
  prediction in all four folds. All conditions are frozen. If too few
  events or single-class folds make inference impossible, INCONCLUSIVE.
  Do not tune feature choice, model or selection threshold after results.
instruments:
  - symbol: EURUSD
    kind: cfd
    venue: FTMO
    identity: "FTMO EUR/USD CFD; LSE 1-minute research price proxy"
    session: "FX 24/5 UTC analysis bars"
    timezone: UTC
  - symbol: GBPUSD
    kind: cfd
    venue: FTMO
    identity: "FTMO GBP/USD CFD; LSE 1-minute research price proxy"
