session_id: gotobi_macro_context_20261011_v1
market: fx
thesis: >-
  Lagged relative government yield, preannounced monetary-policy meeting proximity,
  and Japan banking-calendar subtypes may condition the economic Gotobi effect.
  The primary falsifiable question is whether adding a delayed US-Japan yield
  spread to an existing banking-calendar model improves chronological net
  USDJPY returns in 2023-2025 versus the same calendar-only comparator.
mechanism: >-
  Interest rate policy can dominate exporter/importer FX flows. Policy-decision
  dates can disrupt flows, but LSE event backfills are not proven historically
  observable schedules. Month-end/roll dates can alter settlement imbalances.
  No mechanism is presumed proven by calendar/price correlation.
falsifier: >-
  Reject deployable incremental macro feature if the 2023-2025 walk-forward
  native ML4T filtered candidate does not outperform same-date calendar-only
  model net of 1pip, or its 2024-2025 PnL is nonpositive, or its candidate
  signal uses observations without independently verified availability vintages.
  Fail closed if yield feature coverage below 80% across executable Gotobi dates.
  Do not use retrospective LSE policy decision archives as PIT predictors.
  Statistical tests without multiple-comparison correction do not qualify.
instruments:
  - symbol: USDJPY
    kind: fx
    venue: LSE_REFERENCE_FX_NOT_EXECUTABLE_BROKER
    identity: >-
      USDJPY spot-research proxy, USD base JPY quote, JPY0.01 pip,
      fixed USD10000 base notional and reference USD10000 equity.
      USD/JPY broker spreads, latency, contract margin not verified.
    timezone: Asia/Tokyo
    session: Japanese bank business dates from inherited BOJ-derived registry
