session_id: one_bar_nq_percent_stop_20261012
market: indices
thesis: >-
  A fixed 0.34250680732279554% protective stop changes B0 risk and net PnL
  relative to its fixed 50-point stop, with all entry and scheduled-exit rules held fixed.
mechanism: >-
  The original 50-point stop represents a different fraction of the index as price
  changes. A fixed fraction keeps the price distance proportional to the actual
  filled index level. This is a descriptive counterfactual, not a claim of edge.
falsifier: >-
  Reject the implementation if the stop is not calculated from the actual filled
  entry, violates one-contract or tick rules, or native yearly PnL does not reconcile
  to recorded fills.
instruments:
  - symbol: NQ_PROXY
    kind: index_cfd_proxy
    venue: Dukascopy
    source_symbol: USATECH.IDX/USD
    quote_currency: USD
    multiplier_assumption_usd_per_point: 20
    tick_points: 0.25
    identity_limit: >-
      This BID-only index CFD proxy is not a dated CME E-mini Nasdaq-100 futures
      contract. The NQ multiplier is an illustrative research assumption.
data:
  - id: source_manifest
    role: source_identity
    path: run_log/one_bar_dukascopy_2013_2026_20261011/source_manifest.json
    start_inclusive_utc: "2013-01-01"
    end_inclusive_utc: "2026-07-14"
    protected_after: "2026-07-14"
  - id: b0_2021_stop_anchor
    role: historical_parameter_anchor
    path: run_log/one_bar_practical_1m_20261012/by_year/2021/native_full_tick_cost/evaluation_trades.csv
