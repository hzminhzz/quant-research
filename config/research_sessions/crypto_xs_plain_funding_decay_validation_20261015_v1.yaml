session_id: crypto_xs_plain_funding_decay_validation_20261015_v1
market: crypto

thesis: >-
  The already-developed plain cross-sectional Binance USD-M funding strategy
  remains economically alive in the more mature 2024-2025 market. The edge may
  be smaller than 2022-2023, but the unchanged strategy should retain positive
  net economics after frozen costs and positive normalized funding carry.

mechanism: >-
  Cross-sectional differences in realized perpetual funding still compensate
  the portfolio for taking the opposite side of leveraged crowding. Price
  reversion may weaken as the market matures, but funding-transfer economics
  can remain positive. Decay is therefore diagnosed separately for price IC,
  funding opportunity-set dispersion, normalized realized carry and price-only
  portfolio alpha.

falsifier: >-
  INCONCLUSIVE on any point-in-time, data coverage, official mark-price,
  accounting or native execution failure. REJECT structural edge survival if
  the unchanged 2024-2025 portfolio has nonpositive net return at base costs,
  nonpositive net return at 2x execution costs, or nonpositive annualized
  realized funding yield on average gross exposure. Otherwise VALIDATE edge
  survival. The separate decay classification does not alter this terminal
  economic gate. No signal, universe, rebalance cadence, portfolio weights,
  execution rule or cost assumption may change after validation outcomes are
  observed.

instruments:
  - symbol: BINANCE_UM_USDT_PERP_PANEL
    kind: perpetual
    venue: Binance USD-M Futures
    identity: >-
      Dynamic point-in-time Binance USD-M USDT perpetual panel, using exactly
      the same eligibility and liquidity rules as the frozen development
      sessions.

