  slippage_bps: 0.5

trials:
  - id: trial_1_regime_gated_040
    kind: preregistered
    description: >-
      Regime-gated breakout at 0.40 * ATR(5), suppressing trades when prior_vol_rank < 0.25,
      with continuous risk scaling (0.5x to 1.5x of 0.33%).
  - id: trial_2_regime_gated_050
    kind: preregistered
    description: >-
      Regime-gated breakout with wider 0.50 * ATR(5) band and continuous risk scaling.
  - id: trial_3_adaptive_tier_matrix
    kind: preregistered
    description: >-
      Adaptive multi-tier regime execution: Skip when vol_rank < 0.20; 0.55*ATR with 0.6x risk
      in moderate vol (0.20-0.50); 0.40*ATR with 1.0x risk in expansion vol (>= 0.50).
