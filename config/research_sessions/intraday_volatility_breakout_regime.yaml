session_id: intraday_volatility_breakout_regime
market: futures

thesis: >-
  Conditioning intraday volatility breakout entries on lagged 120-day volatility percentile rank
  (vol_rank >= 0.25) with continuous risk scaling prevents false breakout whipsaws during
  low-volatility regimes and preserves positive net expectancy after transaction costs.

mechanism: >-
  1. Volatility Regime Expansion: Days with high volatility rank exhibit strong directional
     expansion (Spearman Rank IC = 0.195, p < 1e-10), allowing breakout entries to survive.
  2. Noise Suppression: Suppressing trades when vol_rank < 0.25 prunes mean-reverting morning
     chop that hits stops at the open.
  3. Continuous Risk Scaling: Position risk is scaled continuously by regime rank, adhering
     to ml4t-regime-awareness without binary market-timing fragility.

falsifier: >-
  Reject the thesis if:
  1. Net annualized Sharpe ratio fails to achieve positive value on development data.
  2. Maximum drawdown exceeds 20.0%.
  3. Profit factor is less than 1.05 after commissions and slippage.
  4. Number of profitable calendar quarters is fewer than 4 of 6.

