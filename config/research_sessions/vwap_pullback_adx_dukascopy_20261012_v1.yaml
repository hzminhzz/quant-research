# Source-specific Dukascopy CFD switch, frozen before new outcomes.
session_id: vwap_pullback_adx_dukascopy_20261012_v1
market: indices
thesis: >-
  Test B1 OR breakout, B2 OR/VWAP reclaim and B3 OR/VWAP
  reclaim with nonincreasing ADX14 on actual canonical local
  Dukascopy USATECH.IDX/USD 1-minute OHLCV, after earlier LSE
  NQ.F findings. This is a new source-dependent replication:
  CFD tick-volume-weighted VWAP and a shorter vendor session.
