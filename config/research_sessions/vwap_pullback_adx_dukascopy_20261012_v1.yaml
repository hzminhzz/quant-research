  Equity cash-open price-discovery continuation may persist
  after VWAP retests; ADX nonincreasing gate may change
  selection. Source-specific VWAP uses Dukascopy reported
  volume, not genuine CME contract trading volume.
falsifier: >-
  Negative net returns on July-August partial chronological
  validation or inconsistent historic development stress undermine
  the hypothesis. Full July-September validation is BLOCKED
  unless genuine Dukascopy September minute data are present.
  Insufficient coverage or CIs crossing zero are INCONCLUSIVE,
  not successful. No changes to thresholds based on outcomes.
