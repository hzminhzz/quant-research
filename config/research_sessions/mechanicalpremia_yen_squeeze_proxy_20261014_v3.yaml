session_id: mechanicalpremia-yen-squeeze-proxy-20261014-v3
market: fx
thesis: Yen crosses may trend after low H1 ATR conditions due to macro and carry positioning.
mechanism: Carry and macro positioning may create sustained directional flows after
  quiet ATR windows; test the frozen three-pair Yen Squeeze proxy over 2023-2024 development
  data.
falsifier: Reject if development aggregate net expectancy is nonpositive at 2 JPY
  pips or marked daily-equity Sharpe is nonpositive; reject 4-pip robustness if net
  is negative. INCONCLUSIVE for failed native Engine/accounting gates, too few trades,
  unresolved execution behavior, or any missing required pair. This is an exploratory
  broker-neutral fixed-numeraire proxy, not broker equivalence or final validation.
  Never access 2025+ prices.
