  - 6
  pip_jpy: 0.01
  per_fill_fixed_slippage_jpy:
  - 0.01
  - 0.02
  - 0.03
  per_fill_fixed_slippage_engine_usd:
  - 6.66666666667e-05
  - 0.0001333333333333
  - 0.0002
  assumptions: All-in roundtrip proxy split into two equal fixed adverse native Engine
    fill slippages; no additional spread or commission is charged. No historical conversion,
    financing, swap, borrow, or broker contract details. Engine SlippageType.FIXED
    semantics must be tested for sign and repeated fills before strategy outcomes
    are inspected.
