evaluation:
  development_start: '2023-01-01T00:00:00Z'
  development_end: '2025-01-01T00:00:00Z'
  holdout_start: '2025-01-01T00:00:00Z'
  no_holdout_access: true
  protected_data_rule: Never read or access market prices timestamped 2025-01-01 or
    later.
  cadjpy: Included from staged 2023 and 2024 Arrow inputs. Existing bounded Parquet
    snapshot was preserved and validated with ml4t.data MultiAssetSchema; not canonical
    data. UTC localization and completeness limitations remain explicit.
  price_numeraire: Time-invariant 150 JPY per USD. Scale all OHLC, indicator levels,
    stops, and fixed slippage by 1/150 before Engine. Compute signal features in unscaled
    native JPY prices.
  strategy: At each UTC H1 boundary, use completed H1 ATR14, upper median sorted[50]
    of last 100 ATR values, and prior completed H1 Donchian lookback (20 source code,
    500 article prose). If ATR is strictly below median, submit both eligible directional
    stop entries. Orders expire after one hour by native cancel. Risk 1 percent of
    native Engine account value at initial stop distance 2 ATR. 5 percent initial
    margin, fractional base units, no minimum broker lot; no simultaneous OCO. Long
    and short trailing stops update from the current proxy side mark and completed
    H1 2 ATR, ratchet by at least 2 price points. Native Engine stop orders/fills/accounting
    are mandatory.
  execution_deviation: Native Engine has no pending-entry parent/child protective
    stop. Use native entry fills then native protective STOP submitted in callback
    after observed fill, effective no earlier than next 1m bar. Count every entry
    bar lacking protection; if its range crosses initial stop, submit a native market
    exit for the next eligible bar and count as unprotected breach. This is a one-bar
    delayed protection approximation, not broker/source equivalence. No custom fills,
    cash, PnL, equity, or metrics.
  evaluation_periods: 2023 and 2024 calendar year and calendar quarter breakdowns
    only.
  metrics: Use native Engine outputs and ml4t-diagnostic/result APIs for trades, win
    percent, net expectancy, net profit, marked daily-equity Sharpe, Calmar, max drawdown;
    report per-year/quarter and pair.
  portfolio: All three pairs in one native USD account using fixed 150 JPY/USD numeraire;
    report each pair attribution.
baseline: 'Zero exposure and cash baseline: USD 10000 starting capital; equal simultaneous
  multi-pair account for 20/500 windows; all six predeclared lookback and cost scenarios.'
costs:
