# New MVP motivated by already-observed funding-only signal evidence.
# This is a separate exploratory session. 2024+ remains sealed.
session_id: crypto_xs_plain_funding_mvp_20261015_v1
market: crypto

thesis: >-
  Across a point-in-time liquid universe of Binance USD-M USDT-settled
  perpetuals, contracts with lower trailing-24h realized funding outperform
  contracts with higher trailing-24h realized funding over the next 48 hours.
  A dollar-neutral basket that is long the five lowest-funding contracts and
  short the five highest-funding contracts can earn both cross-sectional price
  reversal and the funding transfer after realistic small-account execution
  friction.

mechanism: >-
  Persistent one-sided leveraged demand pushes perpetual funding away from
  zero. High positive funding transfers cash from crowded longs to shorts and
  can coincide with future underperformance; low or negative funding transfers
  cash toward longs and can coincide with future outperformance. The effect
  should weaken when directional demand persists strongly enough to overwhelm
  the financing transfer or when turnover costs dominate the spread in funding.

falsifier: >-
  Stage 1 REJECT: mean 48h cross-sectional Spearman IC must be at least 0.020,
  HAC t-stat must be at least 2.0, both chronological half-sample mean ICs must
  be positive, and at least 150 eligible 48h decision cycles must exist.
  Stage 2 REJECT: if Stage 1 passes, the native funding-aware portfolio must
  have positive net total return, daily-equity Sharpe at least 0.50, maximum
  drawdown no worse than -35%, positive realized funding cashflow, and remain
  net profitable at 2x execution friction. Technical inability to represent or
  independently reconcile actual funding cashflows is INCONCLUSIVE, not a pass.
  No rule, start date, threshold, universe floor, or cost may change after
  outcomes are observed.

instruments:
  - symbol: BINANCE_UM_USDT_PERP_PANEL
    kind: perpetual
    venue: Binance USD-M Futures
    identity: >-
      Dynamic point-in-time panel of canonical Binance USD-M linear
      USDT-quoted perpetuals with matched canonical 1h OHLCV and funding data.
      The panel instrument is a research-universe declaration; actual fills are
      on the concrete symbols carried in each panel row.

