evaluation:
  warmup_start: "2020-01-01T00:00:00Z"
  development_start: "2020-06-01T00:00:00Z"
  development_end: "2024-01-01T00:00:00Z"
  holdout_start: "2024-01-01T00:00:00Z"
  holdout_policy: >-
    All observations at or after 2024-01-01 are sealed. Preparation enumerates
    only 2020-2023 source partitions. 2024-2025 is reserved for a later
    Validation program and 2026 remains protected final-test material.
  decision_clock: >-
    Rebalance decisions are anchored at 00:00 UTC every 48 hours from
    2020-06-01. Price features use only the completed 23:00 hourly bar.
    Funding used by the signal includes actual settlement events observed by
    00:01 UTC. Native orders are submitted on the 00:00 engine event without
    consulting that bar's signal fields and fill at the next 01:00 open.
  universe: >-
    For each decision, require 720 contiguous completed hourly bars and at
    least one actual funding event in the trailing 24 hours. Rank eligible
    contracts by trailing-720h sum(close*base_volume). Target top 40. If
    20-39 contracts are eligible, use all eligible contracts. If fewer than
    20 are eligible, stay flat for that 48h cycle. The floor of 20 equals
    two times the ten portfolio legs and is fixed independently of prior
    observed coverage.
  factor: >-
    cum_funding_24h is the sum of all actual canonical funding_rate events in
    (decision_available-24h, decision_available]. Prediction is
    -cum_funding_24h. No momentum, exhaustion, price filter, ML model, or
    cross-sectional threshold is allowed.
  label: >-
    Forward 48h price return from the 01:00 UTC next-hour entry open to the
    open exactly 48 hours later. Labels are for diagnostics only and never
    enter feature or universe construction.
  portfolio: >-
    Every eligible 48h cycle, long the five lowest cum_funding_24h names at
    +10% target weight each and short the five highest at -10% each. Gross
    target is 1.0 and dollar net target is 0.0. Use native target-weight
    rebalancing, fractional quantities, no stops, no pyramiding, and flatten
    after the final 48h development holding interval.
  funding_accounting: >-
    At each actual funding event, apply -quantity*mark_price*funding_rate to
    the native ml4t broker cash ledger. Canonical archive funding rows can have
    null mark_price. If the IC gate passes, use the existing ml4t-data Binance
    REST funding provider to retrieve exact /fapi/v1/fundingRate markPrice for
    every funding event on every ever-selected portfolio symbol, strictly
    before 2024-01-01. Freeze an execution-data manifest and verify REST
    fundingRate equals the canonical local funding_rate before running the
    portfolio. If any required exact markPrice is unavailable or rates do not
    match, return INCONCLUSIVE rather than substitute OHLCV or a proxy mark.
    Exact bar-boundary events use the prior-bar position conservatively; later
    events inside the hour use the position held after that hour's native
    opening fills. Record every nonzero funding cashflow and independently
    reconcile cumulative funding, broker cash/equity, fills, and final equity.
  reporting: >-
    Report IC, HAC significance, IC IR, chronological-half ICs, breadth,
    cycles, turnover, funding cashflow, net return, daily Sharpe, Calmar,
    max drawdown, yearly returns, base and 2x execution cost, and a no-funding
    decomposition arm.

baseline: >-
  No-trade cash is the null portfolio. A same-signal native no-funding arm at
  base execution costs decomposes price alpha from the funding transfer; it
  is not used for selection.

costs:
  commission_bps: 5.0
  slippage_bps: 4.0
  funding_included: true
  assumptions: >-
    Base execution friction is 5 bps taker commission plus 4 bps one-way
    slippage, interpreted as an all-in spread/slippage placeholder for this
    small-account liquid-universe MVP: 18 bps round trip per fully turned leg.
    The stress arm doubles both to 36 bps round trip. No separate impact model
    is claimed or calibrated at this stage.

trials:
  - id: plain_funding_ic_gate
    kind: preregistered
    description: >-
      Cross-sectional 48h Rank IC for -cum_funding_24h. Require mean IC >=0.020,
      HAC t>=2.0, both chronological halves positive, and >=150 eligible cycles.
  - id: native_funding_base_cost
    kind: preregistered
    description: >-
      Native ml4t.backtest 5-long/5-short funding-aware basket at base 18bps
      round-trip execution friction. Run only if the IC gate passes.
  - id: native_funding_double_cost
    kind: preregistered
    description: >-
      Same native funding-aware basket with 2x execution friction, 36bps
      round trip. No parameter change. Run only if the IC gate passes.
  - id: native_no_funding_decomposition
    kind: preregistered
    description: >-
      Same native basket and base execution costs with funding cash mutation
      disabled, solely to decompose price PnL from funding transfer.
