# Phase 4 execution session for the plain cross-sectional funding factor.
# Phase 3 signal evidence is inherited from the frozen MVP session and is not re-optimized.
session_id: crypto_xs_plain_funding_phase4_20261015_v1
market: crypto

thesis: >-
  The Phase-3-qualified cross-sectional Binance USD-M funding factor can be
  converted into a profitable 5-long/5-short dollar-neutral portfolio after
  realistic execution costs and funding transfers.

mechanism: >-
  The signal ranks contracts by actual trailing-24h realized funding. Low
  funding contracts are bought and high funding contracts are sold. Returns
  can come from both subsequent cross-sectional price reversion and the
  perpetual funding transfer.

falsifier: >-
  REJECT Phase 4 if the native funding-aware base-cost portfolio has nonpositive
  net total return, daily-equity Sharpe below 0.50, max drawdown worse than
  -35%, nonpositive realized funding cashflow, or if the 2x execution-cost arm
  is not net profitable. INCONCLUSIVE if the official Binance mark-price proxy
  cannot be constructed for every held-position funding event or if native
  accounting cannot be independently reconciled. No signal, universe, cadence,
  sizing, or cost parameter may be changed after portfolio outcomes are seen.

