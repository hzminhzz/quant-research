session_id: mechanicalpremia-yen-squeeze-mt5atr-v4-20261014
market: fx
thesis: Source-corrected MT5 SMA-of-TR ATR14 may resolve the mismatch between the
  published Yen Squeeze EA and the failed 2023-2024 Wilder-ATR development proxy;
  no claim that correction makes the strategy profitable.
mechanism: A change from Wilder ATR14 to the standard MT5 iATR14 may alter quiet-volatility
  eligibility, stop width, position sizing and trailing behavior of low-ATR breakout
  entries.
falsifier: Primary fixed source-code 20-hour/2pip trial fails if net expectancy or
  daily Sharpe is nonpositive. Do not access 2025+ market data, claim source-equivalence
  or tune after observing outcomes. 500h is separately declared prose interpretation.
  All 2/4/6-pip runs are development trials. Account/broker limitations remain INCONCLUSIVE.
