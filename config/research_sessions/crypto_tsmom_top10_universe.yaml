# Research session specification: 10-Asset Universe Time-Series Momentum
# Session ID: crypto_tsmom_top10_universe
# Expanding universe from 3 coins to Top 10 Liquid Binance USD-M Futures assets.
session_id: crypto_tsmom_top10_universe
market: crypto

thesis: >-
  Extending Time-Series Momentum across a 10-asset diversified panel of major Binance USD-M perpetual futures
  (BTC, ETH, SOL, XRP, DOGE, ADA, AVAX, NEAR, BAND, BAL) with passive maker execution (1.8 bps fee, 0.0 bps slippage)
  and volatility-targeted risk parity achieves enhanced risk-adjusted returns (Sharpe > 1.20, Max DD < 20%)
  and cross-sectional diversification resilience relative to a concentrated 3-asset trio.

mechanism: >-
  1. Cross-Asset Diversification: Expanding breadth from 3 to 10 assets dampens idiosyncratic coin crashes
     (e.g., individual regulatory or network shocks) while capturing widespread crypto macro liquidity expansions.
  2. Volatility Risk Parity: Equalizing marginal risk contribution ($w_i \propto 1/\sigma_i$) ensures high-beta
     meme/alt tokens (DOGE, AVAX) do not dominate portfolio variance relative to large caps (BTC, ETH).
  3. Execution Spread Advantage: Passive maker post-only limit orders reduce portfolio churn friction to 3.6 bps roundtrip,
     enabling high-capacity multi-asset trend harvesting.

falsifier: >-
  Reject the thesis if:
  1. 10-asset portfolio annualized net Sharpe ratio fails to exceed 1.00 on development data.
  2. Maximum portfolio drawdown exceeds 20.0%.
  3. Deflated Sharpe Ratio (DSR) fails to exceed 0.85 across cumulative evaluated trials.
  4. Trading friction consumes more than 15.0% of gross trading profits under maker execution.

