evaluation:
  cadence: 1h
  development_start: "2021-01-01T00:00:00Z"
  development_end: "2024-12-31T23:59:59Z"
  holdout_start: "2025-01-01T00:00:00Z"
  holdout_end: "2026-07-31T23:59:59Z"
  plan: >-
    Evaluate 10-asset universe portfolio construction (Equal-weight, Volatility-Targeted, and Cross-Sectional Ranking)
    over 4-year development data. Holdout window (2025-01-01 to 2026-07-31) remains strictly untouched until Phase 7.

baseline: >-
  10-asset equal-weight Buy-and-Hold benchmark and 3-asset trio baseline (Iteration 3: Sharpe 1.572).

costs:
  commission_bps: 1.8
  slippage_bps: 0.0
  funding_included: true
  assumptions: >-
    Binance USD-M Futures VIP 0 maker fee of 1.8 bps with BNB discount and 0.0 bps slippage for passive limit fills (3.6 bps roundtrip).
    Signed 8-hour perpetual funding rate cash flows applied at settlement marks.

trials:
  - id: trial_1_top10_equal_weight_tsmom
    kind: preregistered
    description: >-
      Equal-weight TSMOM across 10 assets: 10% maximum target weight per coin with positive ROC_168 under maker execution.
  - id: trial_2_top10_vol_targeted_risk_parity
    kind: preregistered
    description: >-
      Volatility-targeted risk parity TSMOM across 10 assets: Inverse volatility scaling (1 / sigma_i)
      normalizing annualized risk budget across the 10-coin panel.
  - id: trial_3_top10_cross_sectional_top_quintile
    kind: preregistered
    description: >-
      Cross-sectional relative momentum: Long only the top 3 coins (top 30%) with highest positive ROC_168,
      concentrating capital in the strongest market leaders.
  - id: trial_4_top10_regime_gated_maker
    kind: preregistered
    description: >-
      Multi-factor regime-gated 10-asset TSMOM: Scaling risk continuously by ADX trend conviction and choppiness filters.
