evaluation:
  development_start: "2020-01-01T00:00:00Z"
  development_end: "2026-08-31T15:00:00Z"
  holdout_start: "2026-08-31T15:00:00Z"
  holdout_end: "2026-10-10T00:00:00Z"
  inherited_program1: tokyo_alpha_map_program1_v1
  inherited_native: tokyo_alpha_map_program1_native_exploratory_v2
  data_gate: Per-interval complete contiguous minute opens with no forward fill, record cohort sizes and missingness; do not require 03-12 completeness for 09:56-10:10 test
  registered_windows:
    A:
      - ["03:00","05:00"]
      - ["05:00","07:00"]
      - ["07:00","08:30"]
      - ["08:30","09:54"]
      - ["09:56","10:10"]
      - ["10:10","10:30"]
      - ["10:30","12:00"]
    L:
      - ["03:00","09:54"]
      - ["05:00","09:54"]
      - ["07:00","09:54"]
      - ["08:30","09:54"]
    B:
      - ["09:56","10:10"]
      - ["09:56","10:30"]
      - ["09:56","11:00"]
    D:
      - ["09:30","09:54"]
      - ["11:30","11:54"]
      - ["09:56","10:00"]
      - ["11:56","12:00"]
  calendar: Preserve prior official BOJ plus Japan Cabinet Office holiday/date registry, nominal 5 10 15 20 25 30, holiday rollback as an assumption, month-end independently labeled
  gate_definition: Original prior 20 complete 08:00-10:30 bank-session extension, lagged, from original_gate_history.parquet
  tests: Per-interval HAC calendar effects and Holm over 18 increment tests plus B post-fix subgroups and placebo
  controls: Weekday and year only; no post-treatment controls
  retrospective_status: All 2020 through Aug 2026 was already explored
  min_category_n: 30
  min_strategy_n: 100
baseline: Identical timestamp ordinary Tokyo bank-day USDJPY markouts
costs:
  commission_bps: 0.0
  slippage_bps: 0.0
  round_trip_pips: 1.0
  sensitivity_round_trip_pips: [0.8,1.0,1.4]
  cost_source: illustrative, actual historical executable broker spread unavailable
trials:
  - id: T1_window_coverage
    kind: diagnostic
    description: Window-specific completeness and source identity, calendar group composition
  - id: T2_alpha_windows
    kind: diagnostic
    description: A and earlier entry L interval results with HAC/adjusted Gotobi increment
  - id: T3_postfix
    kind: diagnostic
    description: B0 ordinary B1 Gotobi B2 month-end B3 historical conditional per exit horizon
  - id: T4_calendar
    kind: diagnostic
    description: Calendar subdivision weekday/month-end/quarter-end regression
  - id: T5_refutation
    kind: diagnostic
    description: Yearly, placebo and negative control and program-wide Holm comparisons
  - id: T6_reconciliation
    kind: diagnostic
    description: Reconcile previous native engine runs and final research disposition
