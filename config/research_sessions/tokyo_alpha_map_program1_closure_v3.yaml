session_id: tokyo_alpha_map_program1_closure_v3
market: fx
thesis: >-
  Coverage-corrected retrospective closure of Program 1, with the original
  economic hypotheses A through D and unchanged USDJPY fixing schedule.
  Compare Gotobi against ordinary Tokyo bank days, independently for each
  declared observation horizon. Do not claim discovery from reusing observed data.
mechanism: >-
  Corporate USD settlement flow could alter USDJPY drift before 09:55 JST
  and dealer inventory might unwind afterward. Gotobi calendar is a proxy.
falsifier: >-
  No live approval unless positive calendar-controlled Gotobi incremental
  return survives multiplicity adjustment, positive costed mean confidence
  lower bound, stable years, placebo specificity, and adequate eligible-day
  coverage. All retests are retrospective, not independent OOS.
instruments:
  - symbol: USDJPY
    kind: cfd
    venue: UNSPECIFIED_RETAIL_FX_BROKER
    identity: LSE spot USDJPY 1-minute OHLC as broker price proxy, JPY per USD
    session: Tokyo 09:55 JST
    timezone: Asia/Tokyo
