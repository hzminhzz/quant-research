    venue: CME Globex
    identity: >-
      CME E-mini Nasdaq-100 quarterly dated futures. USD quote/settlement,
      USD 20 per index point, 0.25-point tick = USD 5, integer contracts.
      Require recorded source contract, expiry, roll schedule and raw
      price-level mapping before trading PnL is treated as executable.
    session: >-
      Cash opening range 08:30:00-09:00:00 America/Chicago. Entries
      09:00:00 CT onward, with last eligible entry strictly before
      15:55:00 CT; scheduled flat 15:55:00 CT, five minutes before the
      normal CME futures 16:00 CT maintenance halt, NOT the 15:00 CT
      Nasdaq cash close. Exchange holidays/early halts supersede cutoff.
    timezone: America/Chicago
  - symbol: MNQ
    kind: futures
    venue: CME Globex
    identity: >-
      CME Micro E-mini Nasdaq-100 quarterly dated futures. USD quote/settlement,
      USD 2 per index point, 0.25-point tick = USD 0.50, integer contracts.
      Secondary execution/sizing replication, not independent alpha sample;
      require dated MNQ prices and fee/spread evidence.
    session: >-
      Same America/Chicago cash OR and 15:55 CT futures-cutoff protocol as
      NQ. Validate contract-specific trading calendar and liquidity.
    timezone: America/Chicago
