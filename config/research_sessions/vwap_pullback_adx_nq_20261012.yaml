# Phase 1 declaration. No strategy result has been observed for this session.
# Source rules: user-supplied Strategy 2 on 2026-10-12.
session_id: vwap_pullback_adx_nq_20261012
market: futures
thesis: >-
  VWAP PULLBACK WITH ADX GATE. After a confirmed break above the first
  30 minutes of the Nasdaq cash session, a return to and reclaim of
  session VWAP may forecast intraday upward continuation. Require 14-period
  ADX > 20 and non-increasing on the entry-decision bar. The effect must
  yield positive expectancy after realistic futures execution costs and
  add value relative to the same OR-break/VWAP-reclaim strategy without
  the ADX filter. No short positions and no overnight carry.
mechanism: >-
  Hypothesis, not established fact: cash-open price discovery and delayed
  institutional demand can continue after profit taking or countertrend
  liquidity temporarily pushes price to VWAP. The VWAP reclaim may indicate
  buyers still control the session. Sellers fading the morning breakout,
  liquidity providers taking the other side, or forced short covering may
  transfer returns to the long entry. The ADX gate is an empirical attempt
  to avoid chasing a still-accelerating trend. ADX measures trend strength,
  not direction or proof that downward momentum has decelerated. Failure
  regimes may include range days, post-news reversals, false OR breaks,
  weak liquidity, and higher transaction costs.
falsifier: >-
  Reject the economic thesis when an adequately sampled and correctly timed
  chronological development study finds no positive incremental net
  expectancy over the registered OR+VWAP baseline, or net expectancy of the
  full rule is nonpositive under realistic primary costs and plausible
  slippage. Use uncertainty intervals and session-clustered comparisons;
  if evidence is too sparse or costs/data cannot be verified, report
  INCONCLUSIVE or BLOCKED rather than claiming rejection or adoption.
  The final prospective holdout stays sealed until strategy, all trial
  choices, costs and evaluation criteria are frozen. Historical 2026 NQ
  results from other strategies are already observed and are not new
  independent out-of-sample evidence.
