session_id: fvg_trident_fx_mvp_20261014_v1
market: fx

thesis: >-
  In liquid FX, a bullish three-bar fair value gap (FVG) retrace that rejects
  its midpoint during an established daily uptrend predicts enough subsequent
  upside to generate positive net-of-execution-cost expectancy when entered
  at a causal next-bar open and held with a daily trend exit.

mechanism: >-
  Directional repricing may leave a temporary pocket of thin trading. A revisit
  and intrabar rejection can indicate persistent directional demand and
  replenishment near the gap, especially when short and daily trends agree.
  This is a hypothesis, not proof that a candlestick gap represents true
  untraded liquidity in OTC forex. In efficient or reversing markets the
  behavior should disappear.

falsifier: >-
  In the 2010-2024 development window, reject the exact baseline if the
  pooled completed-trade expectancy after modeled entry/exit friction is
  nonpositive, or if the monthly-cluster bootstrap 95% lower confidence
  bound on average R does not exceed zero, provided there are at least
  100 pooled completed trades, at least 20 per pair, and two of three
  pairs have positive mean R. If sample sizes are smaller, record
  INCONCLUSIVE, not PASS. Also report the result in 2010-2017 vs 2018-2024
  without selecting the better era. Overnight financing is not priced
  in this MVP: positive modeled results cannot qualify the strategy.

