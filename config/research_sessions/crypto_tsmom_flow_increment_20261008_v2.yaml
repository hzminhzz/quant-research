  - run_log/research_sessions/crypto_tsmom_two_stage_funnel_stop_exec/trials/trial_4_holdout_and_dsr_audit.json
  - run_log/fixed23_flow_repair_20261007.json
  - run_log/crypto_tsmom_flow_inputs_20261008_source_manifest.json
