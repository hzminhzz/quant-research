session_id: ftmo_fx_intraday_reversion_202610_v2
market: fx

thesis: >-
  Temporary short-horizon liquidity demand in liquid major FX pairs causes some
  completed 30-minute range extremes to overshoot short-run equilibrium. Fading a
  sufficiently extreme five-bar breakout should therefore produce positive net
  60-minute expectancy often enough to improve the probability of passing a static-
  drawdown prop-firm evaluation relative to cash/no-trade, after realistic retail
  CFD costs.

mechanism: >-
  Aggressive market orders, stop execution, and short-lived inventory imbalances can
  push price beyond its recent intraday range without equivalent permanent information.
  The strategy supplies liquidity after the excursion. The effect should weaken or
  reverse during genuine information shocks, persistent macro trends, volatility
  expansion, and sustained one-sided institutional flow. The planned trend-regime veto
  tests this failure mechanism rather than assuming every breakout mean-reverts.

falsifier: >-
  Reject the thesis before optimization if the preregistered D0 raw-event diagnostic
  does not show positive pooled net 60-minute fade expectancy with a HAC-adjusted 95%
  confidence interval excluding zero, with the correct sign in at least two of three
  pairs. Also reject if the pooled effect is not positive in at least three of four
  eras: 2010-2013, 2014-2017, 2018-2021, and 2022-2024. For the T1 development
  strategy, require net daily-equity Sharpe >= 1.0, maximum strategy drawdown <= 6%,
  worst daily loss < 2.5%, zero FTMO 5% daily-loss breaches, zero FTMO 10% static-loss
  breaches in the continuous development run, at least 1,000 pooled closed trades and
  at least 250 per pair. For preregistered 60-calendar-day Phase-1 challenge cohorts,
  require pass rate >= 50% and total breach rate <= 20%. Evidence below the minimum
  trade count is INCONCLUSIVE, not a pass.

