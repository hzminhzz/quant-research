evaluation:
  cadence: 5m
  signal_cadence: 30m
  decision_rule: >-
    Form the signal only after a completed 30-minute bar. Earliest execution is the
    next available 5-minute bar. An upside extreme is close_t above the highest high
    of the previous five completed 30-minute bars and is faded short. A downside
    extreme is close_t below the lowest low of the previous five completed 30-minute
    bars and is faded long.
  d0_method: >-
    Build each signal bar from six complete 5-minute bars. An eligible event requires
    the immediately following 5-minute entry bar and an exact 60-minute exit timestamp.
    Entry and exit must remain within the same Europe/Prague calendar day so the event
    cannot cross the FTMO daily reset. Subtract the frozen 1.50 bps round-trip cost.
    Estimate the pooled event mean with Newey-West HAC covariance using two lags,
    derived from 60-minute outcome overlap divided by the 30-minute signal cadence.
    Contemporaneous multi-pair events are collapsed to timestamp cells and weighted by
    event count. Do not call the built-in research_session.py diagnose helper for D0;
    that helper is limited to 100,000 rows per dataset and does not implement this
    thesis-specific event diagnostic.
  baseline_holding_rule: >-
    Maximum holding period 60 minutes. Initial hard stop is 1.0 times ATR20 measured
    on completed 30-minute bars. No averaging down, martingale, pyramiding, or overnight
    position across the FTMO 00:00 CE(S)T daily reset.
  development_start: "2010-01-04T00:00:00Z"
  development_end: "2024-12-31T23:59:59Z"
  holdout_start: "2025-01-01T00:00:00Z"
  holdout_end: "2026-10-06T23:59:59Z"
  challenge_account_currency: USD
  challenge_initial_capital: 100000
  phase1_profit_target_pct: 10.0
  phase2_profit_target_pct: 5.0
  maximum_loss_pct: 10.0
  maximum_daily_loss_pct: 5.0
  minimum_trading_days: 4
  official_time_limit: unlimited
  challenge_reset_timezone: Europe/Prague
  primary_research_horizon_calendar_days: 60
  risk_per_position_pct: 0.50
  maximum_concurrent_risk_pct: 1.00
  internal_daily_stop_pct: 1.50
  plan: >-
    Use chronological development and walk-forward evidence only through 2024-12-31.
    The 2025-01-01 through 2026-10-06 data is frozen final holdout and must not be
    scored, inspected for strategy performance, or used for selection before the final
    development specification is frozen. Challenge suitability is evaluated as a
    first-passage problem: hit the profit target before the daily or static loss barrier.
    The 60-calendar-day cohort horizon is a research comparison window, not an FTMO rule.

baseline: >-
  Primary comparison is cash/no-trade. T1 is a deliberately simple equal-rule
  three-pair strategy: fade completed 30-minute five-bar range extremes, enter no
  earlier than the next 5-minute bar, risk 0.50% per position, cap concurrent risk at
  1.00%, enforce a 1.50% internal daily stop, use a 1.0*ATR20 hard stop, force exit
  after 60 minutes, and be flat before the FTMO daily reset. No filter or parameter
  optimization is part of T1.

costs:
  commission_bps: 0.25
  slippage_bps: 0.50
  commission_note: >-
    Base commission is modeled as 0.25 bps per side, equivalent to USD 2.50 per
    100,000-unit standard lot side.
  slippage_note: >-
    0.50 bps per side is a conservative fixed spread/slippage proxy, not historical
    FTMO fill data.
  base_round_trip_bps: 1.50
  stress_slippage_bps_per_side: 1.00
  stress_round_trip_bps: 2.50
  overnight_financing_included: false
  overnight_financing_note: "Baseline policy must be flat before daily reset."

trials:
  - id: H0_builtin_diagnostic_failure
    kind: historical_review
    artifact: run_log/research_sessions/ftmo_fx_intraday_reversion_202610/diagnostics/D0_raw_event_diagnostic.json
    description: >-
      Preserve the predecessor session's failed built-in diagnostic. It failed because
      research_session.py diagnose caps each development dataset at 100,000 rows. It
      did not compute the five-bar fade event, did not score the holdout, and is not
      evidence for or against the economic thesis.
  - id: D0_raw_event_diagnostic
    kind: diagnostic
    description: >-
      Cheapest thesis falsification. Execute scripts/run_ftmo_fx_reversion_d0.py on
      development data only. Measure the net 60-minute fade return after the exact
      completed 30-minute five-bar extreme event. Report pooled and per-pair estimates,
      Newey-West HAC confidence intervals, the four preregistered eras, event counts,
      and cost drag. Do not tune any threshold.
  - id: T1_raw_fade_baseline
    kind: preregistered
    description: >-
      Exact baseline strategy declared in this specification with no signal filter or
      parameter search. Evaluate continuous development results and 60-calendar-day
      FTMO Phase-1 first-passage cohorts.
  - id: T2_trend_regime_veto
    kind: preregistered
    description: >-
      Add one economically motivated higher-timeframe strong-trend veto to the accepted
      T1 parent. The exact causal filter must be frozen before T2 is run. T2 must beat
      T1 on the preregistered selection rule without weakening breach controls.
  - id: T3_drawdown_risk_throttle
    kind: preregistered
    description: >-
      Add challenge-state risk throttling to the accepted parent. Reduce position risk
      as the remaining static/daily drawdown buffer contracts. Do not change the alpha
      rule.
  - id: T4_execution_cost_stress
    kind: preregistered
    description: >-
      Re-evaluate the selected development parent with 2.50 bps modeled round-trip
      friction. This is a robustness stress, not a new strategy search.

evidence:
  - data/processed/ftmo_fx_reversion_202610/manifest.json
