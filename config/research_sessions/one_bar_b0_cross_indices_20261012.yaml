research_question: Does the frozen NQ B0 one-bar breakout continuation replicate in ES, DAX, Nikkei 225, and Hang Seng without individual parameter fitting?
mechanism: Breakouts of recent 30-minute extremes may cause short-lived continuation because market participants execute directional flow over multiple minutes. The effect may differ by exchange trading hours and index microstructure.
falsifier: The transfer is not supported if native causal replay fails to beat costs and simple controls, or if session/fill/data artifacts explain the profits.
