session_id: tsmom_40_60_80_lse_2020_2026
market: futures

thesis: >-
  Medium-horizon time-series momentum should remain directionally profitable
  across nearby 40-, 60-, and 80-session lookbacks rather than depend on an
  isolated 60-session optimum. Volatility targeting should reduce drawdown
  without removing the underlying trend return.

mechanism: >-
  Gradual information diffusion, slow institutional positioning, herding, and
  forced deleveraging can create persistent directional flows over multi-week
  to multi-month horizons. The effect should fail in choppy or fast-reversal
  regimes and when execution or financing costs exceed the trend persistence.

falsifier: >-
  The local parameter plateau is weak if only one of 40, 60, and 80 sessions is
  net profitable, if signs change sharply between adjacent lookbacks, or if
  volatility targeting only appears attractive at one lookback. DAX cannot
  contribute to the primary verdict unless its LSE 1-minute data quality gate
  passes.

