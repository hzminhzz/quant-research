  - id: roc_60_vol20
    kind: preregistered
    description: 60-session direction scaled to a 20% annual realized-volatility target, capped at 1x.
  - id: roc_80_vol20
    kind: preregistered
    description: 80-session direction scaled to a 20% annual realized-volatility target, capped at 1x.
  - id: ensemble_40_60_80_raw
