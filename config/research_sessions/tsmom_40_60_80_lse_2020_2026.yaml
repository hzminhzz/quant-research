evaluation:
  cadence: daily_session
  development_start: "2020-01-01T00:00:00Z"
  development_end: "2026-10-01T00:00:00Z"
  plan: >-
    Exploratory development-only run through 2026-09-30. Crypto daily bars are
    built from the canonical Binance 1h archive. Index daily bars are built from
    fresh LSE 1m provider exports using local cash-session dates and official
    trading-day calendars. HYPE starts at listing. No final holdout is claimed.

baseline: Zero-trade cash baseline; all parameter variants are reported without winner selection.

costs:
  funding_included: false
  crypto_commission_bps_per_side: 4.5
  crypto_slippage_bps_per_side: 1.5
  index_proxy_commission_bps_per_side: 2.0
  index_proxy_slippage_bps_per_side: 1.0
  assumptions: >-
    Crypto funding is excluded because no HYPE funding series is available in
    the canonical local catalog. Index costs are exploratory proxy costs, not
    contract-level futures execution costs. A 2x fixed-cost stress is applied
    to the vol-targeted ensemble.

trials:
