# New source-specific exploratory cross-source replication. Freeze before evaluating results.
session_id: vwap_pullback_adx_nas100_20261012_cross_source
market: indices
thesis: >-
  Cross-check the three frozen OR/VWAP/ADX NQ.F strategy signal designs
  B1, B2, B3 over July-September 2026 using the separate London Strategic
  Edge NAS100 index proxy because the primary NQ.F feed has too many
  missing 1-minute bars for three-month validation. This is not an
  executable NQ or CME futures OOS test.
mechanism: >-
  Same economic hypothesis and state machine as the registered NQ
  strategy, now on an independently labeled NAS100 cash index price
  feed, which may have different price basis, volume, sessions and
  spread. Use original 5/20 completed one-minute stop/target and
  15:55 CT flat; convert price-point PnL using hypothetical
  NQ-equivalent multiplier solely for comparability. Volume-weighted
  VWAP is a vendor-index-volume proxy; not CME traded-volume VWAP.
falsifier: >-
  Negative net returns, poor chronological monthly performance or
  weak paired B3-vs-B2 results refute a broad price-pattern transfer
  hypothesis. Any positive results remain inconclusive for CME
  tradability, futures-specific VWAP or passive fill probability.
  Reject claims of true NQ out-of-sample verification on the NAS100
  index feed regardless of returns.
instruments:
  - symbol: NAS100
    kind: cash_index
    venue: London Strategic Edge index price data
    identity: >-
      NAS100 cash-index quotation feed, not dated CME NQ and not a
      directly tradable futures contract; 20 USD/point and 0.25-point
      tick are hypothetical NQ-equivalent translation rules.
    session: >-
      Full XNYS cash sessions 08:30-15:55 America/Chicago with
      30 exact cash OR bars and continuous minute grid. No holiday
      or short day interpolation.
    timezone: America/Chicago
data:
  - id: nas100_price_proxy_1m
    symbol: NAS100
    role: prices
    path: data/processed/vwap_adx_nas100_2026h2_1m.parquet
