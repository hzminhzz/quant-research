  retrospective_validation_end: "2026-10-12T00:00:00Z"
  holdout_start: "2026-11-01T00:00:00Z"
  plan: >-
    Freeze source choice BEFORE examining July-Sep trading outcomes.
    Complete monthly blocks July1-Sep30 CT only (Oct1-2 separate
    unscored). No NQ.F-NAS100 splicing, no source-picking by
