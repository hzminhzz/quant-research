session_id: tokyo_fix_program3_ohlcv_execution_20261011_v1
market: fx
thesis: Evaluate whether unconditional Gotobi post-fix USDJPY short remains positive
  under conservative OHLC limit-fill bounds relative to next-open market benchmark.
  No outcome-based strategy selection.
mechanism: 'HYPOTHESIS: settlement-related pre-fix USD demand may unwind after fixing.
  Price proxies do not measure dealer inventory.'
falsifier: Reject robustness if any conservative bound is nonpositive at1pip full
  sample, or2024-25 or2026 stress is negative. Report all costs/bounds; economic positivity
  cannot approve deployment or establish real fill probability.
