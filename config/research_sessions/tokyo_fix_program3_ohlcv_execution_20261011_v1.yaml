  reference: 09:54 close available09:55. Submit09:55; first fill09:56; TTL1/3 through09:56/58.
    Close decision10:09 native MARKET fill10:10. Never use09:55 close.
  gating: Unchanged OHLC; synthetic volume1 only for strict high>limit+buffer within
    TTL and market exit. PositiveVolumeLimit is execution DATA GATE, not a signal
    input. Cancel after last eligible bar matching. Filled native limit price=limit,
    no optimistic open improvement.
  multiplicity: Holm20 proxy controlled contrasts; Holm14 policy/control contrasts.
    Costs, year and quantiles descriptive. No winner selection. Earlier historical
    trial count incomplete; DSR/PBO not reproducible.
  categorical: Development2020-23 terciles per feature, applied unchanged; no trading
    filter
  dag: weekday/year -> Gotobi and returns; settlement -> price and returns; news ->
    price and returns. Adjust weekday/year only. No causal inventory estimand.
  stop_rule: Execute fixed matrix once; retain runtime failures; no new variants or
    minute optimization.
