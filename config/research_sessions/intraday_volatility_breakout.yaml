evaluation:
  cadence: 1m
  development_start: "2024-01-02T00:00:00Z"
  development_end: "2025-06-30T23:59:59Z"
  holdout_start: "2025-07-01T00:00:00Z"
  holdout_end: "2025-12-30T23:59:59Z"
  plan: >-
    Purged chronological evaluation on 18-month development dataset.
    Holdout period (H2 2025) remains unread until final trial verification.

baseline: >-
  Zero-trade baseline (0% return) and static buy-and-hold equal-weight index basket.

costs:
  commission_bps: 0.5
  slippage_bps: 0.5

trials:
  - id: trial_1_peter_baseline
    kind: preregistered
    description: >-
      Exact Peter rules: Daily ATR(5), entry at Open +/- 0.4*ATR(5), stop-loss at Open,
      exit at session close, 0.33% equity risk per trade, max 1 long and 1 short per asset/day.
  - id: trial_2_low_vol_regime_filter
    kind: preregistered
    description: >-
      Add Peter's low-volatility filter: suppress breakout entries when ATR(5) is below
      its 20th percentile lookback.
  - id: trial_3_multiplier_sensitivity
    kind: diagnostic
    description: >-
      Map parameter sensitivity for breakout multiplier across [0.25, 0.30, 0.40, 0.50, 0.60].
