session_id: intraday_volatility_breakout
market: futures

thesis: >-
  Intraday volatility breakout beyond 0.4 * ATR(5) from the daily cash open captures
  directional institutional flow on index futures and gold, producing positive net expectancy
  when risked at 0.33% per trade and closed at the daily session settlement.

mechanism: >-
  1. Cash Open Price Discovery: The opening bar establishes the reference baseline. Large institutional
     order flow that pushes price beyond 0.4 * ATR(5) exhibits intraday trend persistence.
  2. Asymmetric Risk/Reward: Fixed stop-loss at the open bounds risk to 0.4 * ATR(5), while trending days
     yield larger intraday gains captured at session close.
  3. Capped Daily Budget: Maximum 1 long and 1 short attempt per asset per day limits churn.

falsifier: >-
  Reject the thesis if:
  1. Net annualized Sharpe ratio is less than 0.80 on development data.
  2. Maximum drawdown exceeds 30.0%.
  3. Profit factor is less than 1.15 after realistic futures commissions and slippage.
  4. Win rate drops below 35%.

