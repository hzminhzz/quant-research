session_id: gotobi_paper_replication_20261011_v1
market: fx
thesis: >-
  The Japan bank-day Gotobi indicator predicts additional USDJPY appreciation
  from 03:00 through the last pre-fix minute relative to same-clock ordinary
  bank mornings, with positive standalone expectancy after realistic costs.
mechanism: >-
  HYPOTHESIS, not verified customer order-flow evidence: importer USD settlement
  and pre-fix dealer hedging may affect early Tokyo prices.
falsifier: >-
  Reject economic qualification if the native Gotobi 1-pip USD return is
  nonpositive, its HAC5 95 percent lower bound is not positive, its controlled
  calendar premium is not significant after two-test Holm correction, either
  2024-2025 combined or Jan-Aug2026 is net negative, its net 1.5-pip scenario
  is not positive, or the bar-completeness coverage is below 70 percent.
  No retrospective period counts as genuinely unseen OOS. No deployment approval.
