session_id: fx_support_ml4t_execution_20261008
market: fx
thesis: >-
  The previously frozen out-of-fold LightGBM support-retest gate (p>=0.30)
  selects trades whose executable net results improve on the same-window
  unfiltered support-hold strategy when entered no earlier than the next
  five-minute bar, stopped at origin support, and targeted at the prior
  significant high. Measure actual net R, portfolio equity and risk.
mechanism: >-
  A strong origin-support reclaim in aligned momentum and volatility conditions
  suggests demand has resumed after a retracement. An ML filter may identify
  favorable target-to-stop paths; a high event-classification precision can
  nevertheless fail under execution friction, variable payoff ratio, and
  intrabar support stops.
falsifier: >-
  Economic evidence supports this specific variant only if the OOF ML-gated
  continuous-equity backtest has positive cumulative net PnL, positive mean
  net realized R, at least 80 completed ML trades, positive performance in
  at least two of three currency pairs, and net continuous-daily equity
  Sharpe greater than 0 with maximum drawdown below 6 percent. The net
  expectancy must improve over the same-calendar development baseline
  without requiring more gross leverage. The cost-stress run must remain
  net profitable. The daily-flat variant must be evaluated separately for
  prop-style feasibility. Missing native stop/order semantics, incomplete
  trade ledger, or unverifiable costs mean BLOCKED/INCONCLUSIVE, not PASS.
  This development study cannot approve deployment or override the frozen
  2025-2026 holdout.
