session_id: volt_break_nq_phase4_20261012
classification: EXPLORATORY
approval_status: NOT_APPROVED
phase: 4
thesis: >-
  Test the frozen VOLT BREAK long-only 30-minute close signal with a native
  ML4T Engine, next-minute-open entry, +40 point LIMIT target, -75 point STOP
  MARKET stop, and 14:30 CT market flatten. This tests a Dukascopy CFD proxy,
  not executable CME NQ futures.
mechanism: >-
  Phase 3 observed negative continuation markouts under both declared daily
  coverage variants. Path-dependent TP/SL exits and re-entry could change
  realized returns, but no outcome is assumed. The BID-only proxy and provider
  volume units cannot establish CME execution or actual NQ VWAP.
falsifier: >-
  Reject adoption if the exact native strategy has nonpositive net expectancy
  after illustrative costs, material unresolved OCO or intraminute ambiguity,
  or poor year stability. A strategy result is admissible only if the Engine
  owns all order fills and account ledgers, and a synthetic test verifies
  next-open entry timing. Do not inspect 2026 outcomes.
market:
  type: CME futures research proxy
  timezone: America/Chicago
  session_clock: 00:00-14:30 CT
instrument:
  symbol: NQ-equivalent 1 contract
  source_symbol: USATECH.IDX/USD
  source_provider: Dukascopy
  source_type: BID CFD OHLCV proxy
  point_value_usd: 20
  tick_size_points: 0.25
  source_volume: provider-reported units; not CME executed volume
  actual_dated_contracts_or_rolls: unavailable
data:
  canonical_path: /home/quant/dev/quant/ml4t-data/.data/store/index_minute_NQ
  years_readable: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  development_outcomes: 2019-2025
  warmup: 2018
  sealed_years: [2026]
  partitions_expected: 96
  source_manifest: run_log/one_bar_dukascopy_2013_2026_20261011/source_manifest.json
  source_manifest_sha256: fd810bef0a390a77972d22d1cb0100e6d17f46dec437bed5abf865f39e579e75
  identity_gate: PASS_96_OF_96_2018_2025
  primary_day_cohort: 1576 full 00:00-14:30 CT days from Phase 2
  completeness: every source minute 00:00-14:29 and 14:30 open; no imputation
signals:
  bar_grid: 30-minute, anchored at 00:00 America/Chicago
  midnight_open: first source 1-minute OPEN at 00:00 CT
  barrier: midnight_open + 0.30 * mean(previous 15 completed daily true ranges)
  daily_session: 17:00 previous CT date through 16:14 current CT date
  atr_coverage_variants:
    - name: strict_1300
      minimum_minutes_per_prior_daily_session: 1300
      first_hit_days_phase3: 63
      preserve_as_separate_variant: true
    - name: coverage_1000
      minimum_minutes_per_prior_daily_session: 1000
      first_hit_days_phase3: 217
      registered_after_strict_outcome: true
      preserve_as_separate_variant: true
  vwap: >-
    Midnight-anchored cumulative (H+L+C)/3 times provider volume units divided
    by summed provider volume units, through the last fully observed minute
    of each completed 30-minute decision bar.
  decision_times: completed 30-minute close boundaries 10:00 through 14:00 CT
  entry: next 1-minute source OPEN at the exact decision boundary, only when flat
  daily_entry_cap: 3 filled entries per CT date
  reentry: next eligible completed signal after TP or SL; no cooldown
  last_signal_time: 14:00 CT
  hard_exit: 14:30 CT market order at the 14:30 opening quote
  overnight: forbidden
  news_filter: none
bracket:
  target: LIMIT +40 points (+$800 gross per contract)
  stop: STOP MARKET -75 points (-$1500 nominal per contract before gaps)
  first_entry_minute_protection: record separately; Engine activation timing
    must be verified before strategy run
  same_minute_dual_touch: require atomic OCO or reject/mark strict strategy blocked
account:
  initial_cash_usd: 1000000
  initial_margin_per_contract_usd: 25000
  maintenance_margin_per_contract_usd: 20000
  live_orders: forbidden
cost_trials:
  - id: zero_cost
    commission_usd_per_fill: 0
    slippage_points_per_fill: 0
    interpretation: accounting baseline only
  - id: illustrative_cost
    commission_usd_per_fill: 2.5
    slippage_points_per_fill: 0.25
    tick_points: 0.25
    interpretation: NQ repository assumption; not verified CFD cost
  - id: double_illustrative_cost
    commission_usd_per_fill: 5.0
    slippage_points_per_fill: 0.5
    interpretation: fixed 2x stress; not optimization
metrics:
  required:
    - gross_and_net_pnl
    - trades_and_entries
    - win_rate
    - profit_factor
    - expectancy_per_trade
    - year_stability
    - daily_equity_sharpe
    - daily_equity_calmar
    - daily_equity_max_drawdown
    - exit_reason_counts
    - stop_gap_count
    - dual_touch_ambiguity_count
    - first_entry_minute_unprotected_count
    - ledger_to_equity_reconciliation
    - positions_after_1430_count
trials:
  - id: P4_T0_source_identity_and_api_audit
    kind: diagnostic
    status: completed_before_strategy_trials
    result: 96_of_96_source_hashes_match; ml4t_backtest_0.1.7
  - id: P4_T1_synthetic_engine_timing_and_oco
    kind: diagnostic
    status: planned
    purpose: Verify NEXT_BAR open timing, stop/limit fills, and sibling behavior.
  - id: P4_T2_strict_1300_zero_cost
    kind: preregistered
    status: pending_execution_gate
  - id: P4_T3_strict_1300_illustrative_cost
    kind: preregistered
    status: pending_execution_gate
  - id: P4_T4_strict_1300_double_cost
    kind: preregistered
    status: pending_execution_gate
  - id: P4_T5_coverage_1000_zero_cost
    kind: preregistered
    status: pending_execution_gate
  - id: P4_T6_coverage_1000_illustrative_cost
    kind: preregistered
    status: pending_execution_gate
  - id: P4_T7_coverage_1000_double_cost
    kind: preregistered
    status: pending_execution_gate
  - id: P4_T8_independent_fill_and_ledger_audit
    kind: diagnostic
    status: pending_execution_gate
execution_gate: >-
  Do not run T2-T8 unless T1 demonstrates that native order semantics cannot
  create contradictory same-minute bracket fills, or a bounded approximation
  can preserve Engine-owned fills and conservative adverse attribution without
  editing native ledgers. If this gate fails, mark the strategy trials BLOCKED.
