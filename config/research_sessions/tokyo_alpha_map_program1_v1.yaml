session_id: tokyo_alpha_map_program1_v1
market: fx
thesis: A-D retrospective Tokyo settlement-calendar associations in full 03-12 JST
  sessions; USD buying pressure before 09:55 may reverse afterward.
mechanism: Calendar-linked demand by Japanese importers/banks before the 09:55 daily
  fixing could cause temporary USDJPY dollar-buying price pressure, which may dissipate
  afterward. Historical results are not prospective proof.
falsifier: No positive global-Holm-significant Gotobi increment; nonpositive base
  cost lower bound; insufficient n/year support; unstable signs or placebo concern.
  Onset remains unresolved unless fixed interval increment passes Holm and HAC lag
  robustness.
