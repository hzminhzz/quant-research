  selection: 'At most two: one pre and one post. Positive increment Holm p<.05 and
    CI lower>0, positive 1pip mean CI lower>0, positive1.4pip point mean; 2024-25
    pooled net>=0; every leaveyearout increment and net positive; alternative HAC
    lag signs; placebo concern unresolved means NONE. Full-cohort coverage<80percent
    flags missingness generalization unresolved and rejects strategy selection. Tie
    earliest entry or earliest exit. Native Engine only after gates.'
  placebos: Pre0930-0954 vs1130-1154; post0956-1000 vs1156-1200 matched4min diagnostic;
    main14/34/64min post horizons unavailable at11:55. Negative nominal2/7/12/17/22/27
    rollback, exclude actualGotobi.
  initial_equity_usd: 10000
  position_base_usd: 10000
  no_compounding: true
baseline: Same window ordinary Tokyo bank business days, weekday/year adjusted; gated
  ordinary for B3.
