  - 1.0
  - 1.4
  financing: Not modeled; positions intraday only; spread and commissions unverified
  assumptions: Fixed price-slip applies to EACH entry/exit side inside native Engine,
    regardless of size or actual historical spread. Treat as illustrative; no executable
    quotes, capacity or retail eligibility inferred.
