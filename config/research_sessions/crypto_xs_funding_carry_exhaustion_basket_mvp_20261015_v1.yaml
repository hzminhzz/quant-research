# Frozen MVP adaptation of the attached Gemini funding-carry thesis.
# The canonical Binance 1h source starts 2020-01-01, so the MVP development
# decision window starts 2020-06-01 after source and warmup qualification.
# 2024+ data is validation/protected material and must not be loaded by this MVP.
session_id: crypto_xs_funding_carry_exhaustion_basket_mvp_20261015_v1
market: crypto

thesis: >-
  Across Binance USD-M USDT-settled perpetuals, extreme cross-sectional
  24-hour funding pressure combined with opposite-signed 24-hour relative
  price momentum identifies exhausted leveraged crowding. Every 48 hours,
  a dollar-neutral equal-notional basket shorts high positive-funding laggards
  and buys low or negative-funding resilient contracts. The candidate must
  first show positive 48-hour cross-sectional rank IC with HAC significance
  before any portfolio simulation.
mechanism: >-
  Leveraged directional demand can push perpetual funding away from zero.
  When price stops confirming the crowded direction, the position can earn
  funding carry and benefit from a subsequent crowding unwind. The effect can
  fail when strong directional demand persists or when execution friction and
  squeeze risk exceed the financing transfer.
falsifier: >-
  REJECT before backtesting if the strict funding-exhaustion score has mean
  48-hour Spearman rank IC below 0.015 or HAC t-stat below 2.0 on the frozen
  development window, or if fewer than 150 eligible 48-hour basket cycles
  exist. If the IC gate passes, run the preregistered native portfolio trial.
  REJECT that trial if its net daily-equity Sharpe after 18 bps round-trip
  modeled execution friction is not above the naive unconditional funding-sort
  baseline, or if more than 20 percent of held legs hit the 3x frozen-ATR
  catastrophic stop. Do not tune thresholds after observing results.

instruments:
  - symbol: BINANCE_UM_USDT_PERP_CROSS_SECTION
    kind: perpetual
    venue: Binance USD-M Futures
    identity: >-
      Dynamic point-in-time set of USDT-quoted, USDT-settled linear USD-M
      perpetual contracts present in the canonical Binance 1h archive and
      matched to canonical funding records. Index-like USD-M perpetuals are
      not silently removed unless source identity proves they are non-tradable.

