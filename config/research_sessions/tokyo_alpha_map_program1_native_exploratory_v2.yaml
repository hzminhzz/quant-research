session_id: tokyo_alpha_map_program1_native_exploratory_v2
market: fx
thesis: >-
  Exploratory event-driven continuation of frozen Tokyo Alpha Map Program 1:
  evaluate calendar-defined Gotobi USDJPY short from 09:56 to 10:10 JST,
  original pre-fix long from 08:30 to 09:54, and same-window ordinary-session
  short benchmark, without asserting a significant Gotobi-specific premium.
mechanism: >-
  Predictable settlement-related demand around 09:55 JST may reverse
  after fixing; observed price effects may also reflect broad daily seasonality.
falsifier: >-
  Economic approval is withheld unless Gotobi-specific adjusted premium,
  after-cost expectancy and robust calendar coverage pass the prior frozen gates.
  This additional version runs exploratory native Engine execution despite
  prior statistical nonqualification; old Program1 decisions remain unchanged.
instruments:
  - symbol: USDJPY
    kind: cfd
    venue: UNSPECIFIED_RETAIL_FX_BROKER
    identity: >-
      Canonical LSE USDJPY one-minute OHLC price proxy, quote JPY per USD,
      not executable retail bid/ask or a verified brokerage contract.
    timezone: Asia/Tokyo
    session: Tokyo FX fix
