session_id: fx_support_conditions_20261008
market: fx
thesis: >-
  Among first retests of launch support after a confirmed significant FX swing
  high, causal momentum, trend/volatility state, or a small machine-learning
  classifier may identify events that reach the prior high before the first
  later close below support within 240 complete 30-minute bars. Compare these
  three fixed extensions against the same-window unfiltered support-hold baseline.
mechanism: >-
  Support alone does not guarantee trend continuation. Stronger reclaim
  candles, already improving short-term momentum, and alignment with the
  prevailing medium-term trend may indicate renewed demand and lower odds
  of support breakdown. A simple nonlinear model may capture their interaction.
  Information shocks and adverse execution can invalidate the effect.
falsifier: >-
  For any filtered trial to pass the exploratory predictive gate, require
  at least 100 selected events and at least 20 per pair, at least 35 percent
  first-target-before-support-closing-invalidation events within 240 complete
  30-minute bars, at least 8 percentage points lift versus the same-period
  all-support-holds baseline, a monthly-cluster 95 percent interval lower
  bound above that baseline rate, and selected rate higher than baseline in
  at least two of three currency pairs. I1 is a descriptive baseline, not
  a pass/fail strategy. ML must additionally improve positive-class precision
  over its validation-fold event rate in at least three of four chronological
  folds and have lower Brier score than the constant train-base-rate forecast
  in all four folds. Report every test including failures. Insufficient event
  counts are inconclusive. This is not a trading-economics approval.
