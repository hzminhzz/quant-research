session_id: fx_support_reclaim_newhigh_20261008
market: fx
thesis: >-
  After a significant bullish swing high forms, the first return to its launch
  support followed by a 30-minute close above that support almost always
  precedes a new high, within a finite five-trading-day horizon. The condition
  should predict a materially higher high-retake rate than otherwise comparable
  retests that close at or below that support.
mechanism: >-
  Buyers who initiated the prior upward displacement defend the launch area.
  A closing support hold shows that sell pressure was absorbed and the prior
  swing high is likely to be revisited. This mechanism can fail during a
  persistent bearish macro trend, a regime shift, or when demand disappears.
falsifier: >-
  Define almost always as a pooled conditional probability of at least 90%
  that a new high occurs within 240 subsequent complete 30-minute FX bars
  after a valid support-holding retest. Require a monthly-cluster-robust 95%
  confidence-interval lower bound above 80%, at least 10 percentage points
  predictive lift versus first touches that close at or below support, and a
  hit rate of at least 80% in each of EURUSD, GBPUSD and AUDUSD. Require at
  least 150 support-hold events pooled, 30 per pair, and 30 break-close
  control events; otherwise declare insufficient evidence. Report all
  conditions and do not tune thresholds based on results. A breach of any
  criterion rejects this operationalized version of the claim.
