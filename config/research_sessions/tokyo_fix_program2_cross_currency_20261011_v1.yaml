session_id: tokyo_fix_program2_cross_currency_20261011_v1
market: fx
thesis: Retrospective cross-currency settlement-flow attribution and incremental USDJPY
  prediction at Tokyo fix; new tests on already inspected 2020-Aug2026 dates, not
  unseen OOS.
mechanism: Corporate USD settlement demand could move multiple USD quotes before09:55JST;
  inventory unwind could follow. External USD factor may confirm direction. Calendar
  is only a flow proxy.
falsifier: No candidate if external increment fails Holm640, net and matched-unconditional
  increment HAC lower bounds not positive, n<100, 2024-25 n<50 or negative, 2026 stress
  n<20 or negative, fewer than5 positive years, or incompatible sources. No causal
  attribution without actual independent compatible JPY crosses.
