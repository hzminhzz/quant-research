status: EXPLORATORY
approval_status: NOT_APPROVED
trial_count: 1

research_question: >-
  Conditional on an established bearish swing structure, does a causal close
  above the most recent confirmed lower high identify a tradable BTCUSDT
  1-hour upside reversal?

hypothesis: >-
  A downtrend with descending confirmed swing highs and swing lows shows
  persistent supply. A close that crosses above the latest confirmed lower
  high by a volatility-scaled buffer can mark a failure of that bearish
  structure and produce positive long expectancy.

falsifier: >-
  The baseline does not justify another feature-filter trial if 2025 OOS net
  expectancy is non-positive, or if results are too sparse or unstable to
  distinguish a structural effect from noise.

