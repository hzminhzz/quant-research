[project]
name = "marimo-quant-research"
version = "0.1.0"
description = "ML4T Quantitative Research Suite with Marimo Reactive Notebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo[recommended]>=0.24.0",
    "polars==1.44.2",
    "altair>=5.0.0",
    "ml4t-engineer==0.1.4",
    "ml4t-diagnostic==0.1.6.post2",
    # Opening-order and funding lifecycle adapters are qualified against this version.
    "ml4t-backtest==0.1.7",
    "pydantic>=2.8",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "cloudpickle==3.1.2",
    "exchange-calendars==4.13.2",
    # Must match the producer's current Hive store layout; 0.1.8 changes key storage.
    "ml4t-data==0.1.0b14",
    "lse-data>=0.1.0",
    "ta-lib>=0.4.0",
    "pyyaml>=6.0",
    "lightgbm>=4.7.0",
    "shap>=0.52.0",
    "ml4t-live[experimental]>=0.1.2",
    "ml4t-models[integration]==0.1.4",
]

[tool.marimo.runtime]
output_max_bytes = 10_000_000

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff==0.16.8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "/home/quant/dev/trading-connector", ".ci/trading-connector"]
testpaths = ["tests"]
markers = [
    "data: requires the external, gitignored ml4t-data store",
    "slow: long-running integration check",
]
# --strict-markers fails on an unregistered marker instead of silently letting
# the test fall outside its lane filter (see tests/conftest.py).
addopts = "-n 2 --dist worksteal --strict-markers"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
