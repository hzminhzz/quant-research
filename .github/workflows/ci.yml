name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-policy:
    name: Managed feature policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run scoped Ruff policy
        run: uv run --frozen ruff check --config scripts/ruff-managed.toml src/managed_strategies
      - name: Run managed feature AST policy
        run: uv run --frozen python scripts/check_managed_features.py

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ATS-3/7 test imports live in a separately released public repository.
      # Pin its exact source identity; do not follow moving main or use credentials.
      - name: Checkout pinned public connector for ATS tests
        uses: actions/checkout@v4
        with:
          repository: hzminhzz/trading-connector
          ref: 8b82d597e36e9f95dba2446b7d0d43c6819207ab
          path: .ci/trading-connector
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Configure kernel and isolation prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update && sudo apt-get install -y tmux bubblewrap
      - name: Start known tmux control session
        run: tmux new-session -d -s ml4t-ci-m8-control "sleep 3600"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run data-free unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/trading-connector
        run: uv run --frozen pytest -m "not data and not slow" -q
      - name: Validate published descriptive research handoffs
        run: uv run --frozen python scripts/quant.py validate-handoff

  full-tests:
    name: Full tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned public connector for ATS tests
        uses: actions/checkout@v4
        with:
          repository: hzminhzz/trading-connector
          ref: 8b82d597e36e9f95dba2446b7d0d43c6819207ab
          path: .ci/trading-connector
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Configure kernel and isolation prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update && sudo apt-get install -y tmux bubblewrap
      - name: Start known tmux control session
        run: tmux new-session -d -s ml4t-ci-m8-control "sleep 3600"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run full suite (data tests skip when artifacts are absent)
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/trading-connector
        run: uv run --frozen pytest -q -rs
      - name: Check Marimo reactive DAG
        run: uv run --frozen marimo check notebooks/quantified_strategies_engulfing.py
